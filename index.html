  if(!budgetForm.payer){toast('누가 결제했는지 골라주세요');return;}
  if(budgetForm.editId){
    const b=t.budget.find(x=>x.id===budgetForm.editId);
    Object.assign(b,{title,amount,payer:budgetForm.payer,cat:budgetForm.cat,date}); stamp(b);
  } else {
    t.budget.push(stamp({id:uid('b'),title,amount,payer:budgetForm.payer,cat:budgetForm.cat,date}));
  }
  stamp(t); persist(); closeBudgetForm(); renderTripDetail();
  toast('저장했어요 💰');
}
function deleteBudget(){
  if(!budgetForm.editId) return;
  if(!confirm('이 지출을 지울까요?')) return;
  const t=getTrip(budgetForm.tripId); markDeleted(budgetForm.editId);
  t.budget=t.budget.filter(x=>x.id!==budgetForm.editId); stamp(t); persist();
  closeBudgetForm(); renderTripDetail(); toast('지웠어요');
}

function ensureBudgetDom(){
  if(document.getElementById('budgetSheet')) return;
  const w=document.createElement('div');
  w.innerHTML=`
  <div class="sheet-bg" id="budgetSheetBg" onclick="closeBudgetForm()"></div>
  <div class="sheet" id="budgetSheet"><div class="grab"></div><div class="body">
    <h2 id="bf-title2">지출 추가</h2>
    <div class="form">
      <label>내용</label>
      <input id="bf-title" placeholder="예: 리조트 숙박">
      <label>금액 (원)</label>
      <input id="bf-amount" type="number" inputmode="numeric" placeholder="예: 800000">
      <label>누가 결제했나요?</label>
      <div class="chips" id="bf-payer">
        <button class="chip me" data-who="me" onclick="setBudgetPayer('me')">🧑 ${CONFIG.NAME_ME}</button>
        <button class="chip pt" data-who="partner" onclick="setBudgetPayer('partner')">👩 ${CONFIG.NAME_PARTNER}</button>
        <button class="chip both" data-who="both" onclick="setBudgetPayer('both')">💕 공동</button>
      </div>
      <label>분류</label>
      <div class="chips" id="bf-cats"></div>
      <label>날짜</label>
      <input id="bf-date" type="date">
      <div class="btnrow"><button class="btn ghost" onclick="closeBudgetForm()">취소</button><button class="btn primary" onclick="saveBudget()">저장</button></div>
      <div class="btnrow" id="bf-delrow"><button class="btn ghost" style="color:var(--me)" onclick="deleteBudget()">🗑️ 삭제</button></div>
    </div>
  </div></div>`;
  document.body.appendChild(w);
}
</script>
<script>
/* ═══════════════════════════════════════════════
   schedule.js — 📅 일정 (여행 상세 안 서브탭)
   날짜별 타임라인 카드 (지하철 노선도 느낌 · 시간순)
   plan: {id, date, time, title, cat, memo, updatedAt}
   ═══════════════════════════════════════════════ */
const PLAN_CATS=[['이동','🚗','#6B84B0'],['숙소','🏨','#B06B6B'],['식사','🍽️','#CBB85C'],['관광','📸','#5FAE7E'],['기타','📌','#8A7B9E']];
const planIcon=c=>{const f=PLAN_CATS.find(x=>x[0]===c);return f?f[1]:'📌';};
const planColor=c=>{const f=PLAN_CATS.find(x=>x[0]===c);return f?f[2]:'#8A7B9E';};
const WD=['일','월','화','수','목','금','토'];
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function tripDates(t){
  if(!t.startDate) return [];
  const out=[]; let d=new Date(t.startDate+'T00:00:00'); const end=new Date((t.endDate||t.startDate)+'T00:00:00');
  while(d<=end){ out.push(ymd(d)); d.setDate(d.getDate()+1); }
  return out;
}
let curPlanDay=null;

function renderPlans(trip, body){
  const days=tripDates(trip);
  // 기간 밖 날짜(직접 입력)도 칩에 포함
  const extra=[...new Set((trip.plans||[]).map(p=>p.date).filter(d=>d&&!days.includes(d)))].sort();
  const allDays=[...days,...extra];
  const noDate=(trip.plans||[]).some(p=>!p.date);
  if(!allDays.includes(curPlanDay) && curPlanDay!=='') curPlanDay = allDays[0] || '';

  let html='';
  if(allDays.length || noDate){
    html+=`<div class="dayscroll">`;
    allDays.forEach((d,i)=>{
      const dt=new Date(d+'T00:00:00');
      html+=`<div class="daychip${d===curPlanDay?' on':''}" onclick="setPlanDay('${d}')">Day ${i+1}<b>${dt.getMonth()+1}.${dt.getDate()} ${WD[dt.getDay()]}</b></div>`;
    });
    if(noDate) html+=`<div class="daychip${curPlanDay===''?' on':''}" onclick="setPlanDay('')">미정<b>날짜없음</b></div>`;
    html+=`</div>`;
  }
  html+=`<div class="fab-row"><button class="btn primary" onclick="openPlanForm('${trip.id}')">+ 일정 추가</button></div>`;

  const items=(trip.plans||[]).filter(p=>(p.date||'')===curPlanDay).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if(!items.length){
    html+=`<div class="empty-state"><span class="big">📅</span>이 날의 일정이 없어요.<br>일정을 추가해볼까요?</div>`;
  } else {
    html+=`<div class="tl">`;
    items.forEach(p=>{
      html+=`<div class="tl-item" onclick="openPlanForm('${trip.id}','${p.id}')">
        <span class="dot" style="background:${planColor(p.cat)}"></span>
        <div class="tl-time">${p.time?esc(p.time):'시간 미정'}</div>
        <div class="tl-card"><div class="tt">${planIcon(p.cat)} ${esc(p.title)||'(제목 없음)'}</div>
          <div class="tcat">${esc(p.cat||'기타')}</div>
          ${p.memo?`<div class="tm">${esc(p.memo)}</div>`:''}</div>
      </div>`;
    });
    html+=`</div>`;
  }
  body.innerHTML=html;
}
function setPlanDay(d){ curPlanDay=d; renderTripDetail(); }

/* ── 폼 ── */
let planForm={tripId:null,editId:null,cat:'관광'};
function openPlanForm(tripId,planId){
  ensurePlanDom();
  const t=getTrip(tripId); const p=planId?(t.plans||[]).find(x=>x.id===planId):null;
  planForm={tripId,editId:planId||null,cat:p?p.cat||'관광':'관광'};
  document.getElementById('pf-title2').textContent=p?'일정 수정':'일정 추가';
  document.getElementById('pf-title').value=p?p.title||'':'';
  document.getElementById('pf-date').value=p?p.date||'':(curPlanDay||t.startDate||'');
  document.getElementById('pf-time').value=p?p.time||'':'';
  document.getElementById('pf-memo').value=p?p.memo||'':'';
  renderPlanCats();
  document.getElementById('pf-delrow').style.display=planId?'flex':'none';
  document.getElementById('planSheetBg').classList.add('show');
  document.getElementById('planSheet').classList.add('show');
  if(!p) setTimeout(()=>document.getElementById('pf-title').focus(),80);
}
function closePlanForm(){document.getElementById('planSheetBg').classList.remove('show');document.getElementById('planSheet').classList.remove('show');}
function setPlanCat(c){planForm.cat=c;renderPlanCats();}
function renderPlanCats(){
  document.getElementById('pf-cats').innerHTML=PLAN_CATS.map(([c,ic])=>
    `<button class="chip${c===planForm.cat?' on both':''}" onclick="setPlanCat('${c}')">${ic} ${c}</button>`).join('');
}
function savePlan(){
  const t=getTrip(planForm.tripId); if(!t) return;
  const title=document.getElementById('pf-title').value.trim();
  const date=document.getElementById('pf-date').value;
  const time=document.getElementById('pf-time').value;
  const memo=document.getElementById('pf-memo').value.trim();
  if(!title){toast('일정 내용을 입력해주세요');return;}
  if(planForm.editId){
    const p=t.plans.find(x=>x.id===planForm.editId);
    Object.assign(p,{title,date,time,cat:planForm.cat,memo}); stamp(p);
  } else {
    t.plans.push(stamp({id:uid('p'),title,date,time,cat:planForm.cat,memo}));
  }
  stamp(t); persist(); closePlanForm();
  curPlanDay=date||'';   // 저장한 날짜로 이동
  renderTripDetail(); toast('저장했어요 📅');
}
function deletePlan(){
  if(!planForm.editId) return;
  if(!confirm('이 일정을 지울까요?')) return;
  const t=getTrip(planForm.tripId); markDeleted(planForm.editId);
  t.plans=t.plans.filter(x=>x.id!==planForm.editId); stamp(t); persist();
  closePlanForm(); renderTripDetail(); toast('지웠어요');
}

function ensurePlanDom(){
  if(document.getElementById('planSheet')) return;
  const w=document.createElement('div');
  w.innerHTML=`
  <div class="sheet-bg" id="planSheetBg" onclick="closePlanForm()"></div>
  <div class="sheet" id="planSheet"><div class="grab"></div><div class="body">
    <h2 id="pf-title2">일정 추가</h2>
    <div class="form">
      <label>내용</label>
      <input id="pf-title" placeholder="예: 후에 궁성 관광">
      <label>분류</label>
      <div class="chips" id="pf-cats"></div>
      <label>날짜 / 시간</label>
      <div class="daterow"><input id="pf-date" type="date"><input id="pf-time" type="time"></div>
      <label>메모 (선택)</label>
      <input id="pf-memo" placeholder="예: 입장료 15만동, 오후 더움">
      <div class="btnrow"><button class="btn ghost" onclick="closePlanForm()">취소</button><button class="btn primary" onclick="savePlan()">저장</button></div>
      <div class="btnrow" id="pf-delrow"><button class="btn ghost" style="color:var(--me)" onclick="deletePlan()">🗑️ 삭제</button></div>
    </div>
  </div></div>`;
  document.body.appendChild(w);
}
</script>
<script>
/* ═══════════════════════════════════════════════
   packing.js — 🎒 준비물 (여행 상세 안 서브탭)
   목록(그룹)별 물건 + 담당(공용/윤호/가진) + 체크박스
   packing item: {id, group, item, who:"공용|윤호|가진", checked, updatedAt}
   ═══════════════════════════════════════════════ */
const PACK_WHO=[['공용','💕','var(--both)'],['윤호','🧑','var(--me)'],['가진','👩','var(--pt)']];
const packWhoColor=w=>{const f=PACK_WHO.find(x=>x[0]===w);return f?f[2]:'var(--sub)';};

function renderPacking(trip, body){
  const list=trip.packing||[];
  const total=list.length, done=list.filter(x=>x.checked).length;
  const pct=total?Math.round(done/total*100):0;
  let html=`<div class="pack-prog">
    <div class="pl"><span>챙긴 준비물</span><span><b>${done}</b> / ${total}</span></div>
    <div class="pack-bar"><span style="width:${pct}%"></span></div>
  </div>
  <div class="fab-row"><button class="btn primary" onclick="openPackForm('${trip.id}')">+ 준비물 추가</button></div>`;

  if(!total){
    html+=`<div class="empty-state"><span class="big">🎒</span>목록을 만들고 챙길 물건을<br>담아보세요. (예: 2번칸)</div>`;
  } else {
    const shown=list.filter(x=>typeof passPackWho!=='function'||passPackWho(x.who));
    if(!shown.length){ body.innerHTML=html+`<div class="empty-state"><span class="big">🎒</span>이 조건에 맞는 준비물이 없어요.</div>`; return; }
    // 그룹별 묶기 (등장 순서 유지)
    const groups=[]; const gmap={};
    shown.forEach(x=>{ const g=x.group||'기타'; if(!gmap[g]){gmap[g]=[];groups.push(g);} gmap[g].push(x); });
    groups.forEach(g=>{
      const items=gmap[g];
      const gd=items.filter(x=>x.checked).length;
      html+=`<div class="pack-group"><div class="pack-ghead"><span>🧳 ${esc(g)}</span><span class="gc">${gd}/${items.length}</span></div>`;
      items.forEach(x=>{
        html+=`<div class="pack-item${x.checked?' done':''}">
          <div class="chk" onclick="togglePack('${trip.id}','${x.id}')">${x.checked?'✓':''}</div>
          <span class="pi-name" onclick="openPackForm('${trip.id}','${x.id}')">${esc(x.item)||'(이름 없음)'}</span>
          <span class="pi-who" style="background:${packWhoColor(x.who)}">${esc(x.who||'공용')}</span>
          <button class="pi-del" onclick="deletePack('${trip.id}','${x.id}')">🗑️</button>
        </div>`;
      });
      html+=`</div>`;
    });
  }
  body.innerHTML=html;
}
function togglePack(tripId,itemId){
  const t=getTrip(tripId); const x=(t.packing||[]).find(i=>i.id===itemId); if(!x) return;
  x.checked=!x.checked; stamp(x); stamp(t); persist(); renderTripDetail();
}

/* ── 폼 ── */
let packForm={tripId:null,editId:null,who:'공용'};
function openPackForm(tripId,itemId){
  ensurePackDom();
  const t=getTrip(tripId); const x=itemId?(t.packing||[]).find(i=>i.id===itemId):null;
  packForm={tripId,editId:itemId||null,who:x?x.who||'공용':'공용'};
  document.getElementById('kf-title2').textContent=x?'준비물 수정':'준비물 추가';
  document.getElementById('kf-item').value=x?x.item||'':'';
  document.getElementById('kf-group').value=x?x.group||'':'';
  // 기존 그룹 목록 datalist
  const groups=[...new Set((t.packing||[]).map(i=>i.group).filter(Boolean))];
  document.getElementById('kf-groups').innerHTML=groups.map(g=>`<option value="${esc(g)}">`).join('');
  renderPackWho();
  document.getElementById('kf-delrow').style.display=itemId?'flex':'none';
  document.getElementById('packSheetBg').classList.add('show');
  document.getElementById('packSheet').classList.add('show');
  if(!x) setTimeout(()=>document.getElementById('kf-item').focus(),80);
}
function closePackForm(){document.getElementById('packSheetBg').classList.remove('show');document.getElementById('packSheet').classList.remove('show');}
function setPackWho(w){packForm.who=w;renderPackWho();}
function renderPackWho(){
  document.getElementById('kf-who').innerHTML=PACK_WHO.map(([w,ic])=>
    `<button class="chip${w===packForm.who?' on both':''}" onclick="setPackWho('${w}')">${ic} ${w}</button>`).join('');
}
function savePack(){
  const t=getTrip(packForm.tripId); if(!t) return;
  const item=document.getElementById('kf-item').value.trim();
  const group=document.getElementById('kf-group').value.trim()||'기타';
  if(!item){toast('준비물 이름을 입력해주세요');return;}
  if(packForm.editId){
    const x=t.packing.find(i=>i.id===packForm.editId);
    Object.assign(x,{item,group,who:packForm.who}); stamp(x);
  } else {
    t.packing.push(stamp({id:uid('k'),item,group,who:packForm.who,checked:false}));
  }
  stamp(t); persist(); closePackForm(); renderTripDetail(); toast('저장했어요 🎒');
}
function deletePack(tripId,itemId){
  if(!confirm('이 준비물을 지울까요?')) return;
  const t=getTrip(tripId); markDeleted(itemId);
  t.packing=t.packing.filter(i=>i.id!==itemId); stamp(t); persist(); renderTripDetail(); toast('지웠어요');
}

function ensurePackDom(){
  if(document.getElementById('packSheet')) return;
  const w=document.createElement('div');
  w.innerHTML=`
  <div class="sheet-bg" id="packSheetBg" onclick="closePackForm()"></div>
  <div class="sheet" id="packSheet"><div class="grab"></div><div class="body">
    <h2 id="kf-title2">준비물 추가</h2>
    <div class="form">
      <label>목록 (칸/카테고리)</label>
      <input id="kf-group" list="kf-groups" placeholder="예: 2번칸, 세면도구, 기내">
      <datalist id="kf-groups"></datalist>
      <label>준비물</label>
      <input id="kf-item" placeholder="예: 변환 어댑터">
      <label>담당</label>
      <div class="chips" id="kf-who"></div>
      <div class="btnrow"><button class="btn ghost" onclick="closePackForm()">취소</button><button class="btn primary" onclick="savePack()">저장</button></div>
      <div class="btnrow" id="kf-delrow"><button class="btn ghost" style="color:var(--me)" onclick="deletePack(packForm.tripId,packForm.editId)">🗑️ 삭제</button></div>
    </div>
  </div></div>`;
  document.body.appendChild(w);
}
</script>
<script>
/* ═══════════════════════════════════════════════
   home.js — 🏠 홈 대시보드
   여행 기록과 준비 현황을 한눈에 보여주는 요약 화면
   ═══════════════════════════════════════════════ */

function homeToday(){
  const d=new Date();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function homeStats(){
  const visited=deriveVisited();
  const days=state.trips.reduce((sum,t)=>sum+Math.max(0,tripDays(t)||0),0);
  const spent=state.trips.reduce((sum,t)=>sum+(t.budget||[]).reduce((s,b)=>s+(+b.amount||0),0),0);
  return {
    countries:Object.keys(visited.countries).length,
    cities:Object.keys(visited.cities).length,
    days,
    spent
  };
}

/* 각자의 발자국 (같이 여행 포함) */
function personStats(who){
  const vis=deriveVisited();
  const inSet=set=>set.has('both')||set.has(who);
  const countries=Object.values(vis.countries).filter(c=>inSet(c.who)).length;
  const cities=Object.values(vis.cities).filter(c=>inSet(c.who)).length;
  const days=state.trips.filter(t=>(t.cities||[]).some(c=>c.who===who||c.who==='both'))
    .reduce((s,t)=>s+Math.max(0,tripDays(t)||0),0);
  return {countries,cities,days};
}

function homeOpenTrip(id){
  switchTab('trips');
  openTrip(id);
}

function homeTripCard(t, kind){
  const dday=tripDday(t);
  const countries=(t.countries||[]).map(koName).join(' · ');
  const label=kind==='upcoming' ? dday.label : fmtPeriod(t);
  const detail=[countries, tripDays(t)?`${tripDays(t)}일`:'' ].filter(Boolean).join(' · ');
  return `<button class="home-trip" onclick="homeOpenTrip('${t.id}')">
    <span class="home-trip-icon">${kind==='upcoming'?'✈️':'📷'}</span>
    <span class="home-trip-copy"><b>${esc(t.name)||'(이름 없는 여행)'}</b><small>${esc(detail)||'여행 정보'}</small></span>
    <span class="home-trip-label ${kind==='upcoming'&&dday.cls?'muted':''}">${esc(label)}</span>
  </button>`;
}

function renderHome(){
  const scr=document.getElementById('screen-home');
  if(!scr) return;
  const stats=homeStats();
  const meP=personStats('me'), ptP=personStats('partner');
  const today=homeToday();
  const trips=state.trips||[];
  const upcoming=trips
    .filter(t=>t.startDate && (t.endDate||t.startDate)>=today)
    .sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''))[0];
  const recent=trips
    .filter(t=>(t.endDate||t.startDate||'') && (t.endDate||t.startDate)<today)
    .sort((a,b)=>(b.endDate||b.startDate).localeCompare(a.endDate||a.startDate))[0];

  scr.innerHTML=`<div class="home">
    <section class="home-hero">
      <p>윤호와 가진의 여행 기록</p>
      <h2>다음 여행도<br>우리답게 채워가요 💕</h2>
    </section>

    <section class="home-section">
      <div class="home-section-head"><h3>우리의 발자국</h3><button onclick="switchTab('map')">지도 보기 →</button></div>
      <div class="home-stats">
        <div><b>${stats.countries}</b><span>개국</span></div>
        <div><b>${stats.cities}</b><span>도시</span></div>
        <div><b>${stats.days}</b><span>일</span></div>
        <div><b>${stats.spent.toLocaleString()}</b><span>원 지출</span></div>
      </div>
    </section>

    <section class="home-section">
      <div class="home-section-head"><h3>각자의 발자국</h3><small>같이 간 여행 포함</small></div>
      <div class="person-stats">
        <div class="person-card me"><div class="ph">🧑 ${CONFIG.NAME_ME}</div>
          <div class="pnums"><span><b>${meP.countries}</b>개국</span><span><b>${meP.cities}</b>도시</span><span><b>${meP.days}</b>일</span></div></div>
        <div class="person-card pt"><div class="ph">👩 ${CONFIG.NAME_PARTNER}</div>
          <div class="pnums"><span><b>${ptP.countries}</b>개국</span><span><b>${ptP.cities}</b>도시</span><span><b>${ptP.days}</b>일</span></div></div>
      </div>
    </section>

    <section class="home-section">
      <div class="home-section-head"><h3>${upcoming?'다가오는 여행':'여행 계획'}</h3><button onclick="switchTab('trips')">전체 보기 →</button></div>
      ${upcoming ? homeTripCard(upcoming,'upcoming') : `<div class="home-empty">🧳 아직 정해진 여행이 없어요.<br><button onclick="switchTab('trips')">새 여행 만들기</button></div>`}
    </section>

    ${recent ? `<section class="home-section"><div class="home-section-head"><h3>최근 여행</h3><button onclick="switchTab('trips')">전체 보기 →</button></div>${homeTripCard(recent,'recent')}</section>` : ''}
  </div>`;
}
</script>
<script>
/* ═══════════════════════════════════════════════
   wish.js — ⭐ 위시 탭
   위시 목록 · 날짜 설정 · 여행으로 승격
   ═══════════════════════════════════════════════ */

let wishForm={editId:null,scope:'world',who:null};

function wishName(w){ return w.scope==='world' ? koName(w.name) : w.name; }
function wishWho(w){
  if(w.who==='both') return {label:'💕 같이',cls:'both'};
  if(w.who==='me') return {label:`🧑 ${CONFIG.NAME_ME}`,cls:'me'};
  return {label:`👩 ${CONFIG.NAME_PARTNER}`,cls:'pt'};
}
function wishDday(date){
  if(!date) return {label:'날짜 미정',cls:'muted'};
  const today=homeToday();
  const diff=Math.round((new Date(date+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);
  if(diff===0) return {label:'D-DAY',cls:''};
  return diff>0 ? {label:`D-${diff}`,cls:''} : {label:`D+${-diff}`,cls:'muted'};
}
function sortedWishes(){
  const today=homeToday();
  return [...state.wishes].sort((a,b)=>{
    const group=w=>!w.planDate?1:(w.planDate>=today?0:2);
    const ga=group(a),gb=group(b);
    if(ga!==gb) return ga-gb;
    if(ga===0) return a.planDate.localeCompare(b.planDate);
    if(ga===2) return b.planDate.localeCompare(a.planDate);
    return (b.updatedAt||0)-(a.updatedAt||0);
  });
}

function renderWish(){
  ensureWishDom();
  const scr=document.getElementById('screen-wish');
  const wishes=sortedWishes();
  const world=wishes.filter(w=>w.scope==='world').length;
  const korea=wishes.length-world;
  let html=`<div class="screen-head"><h2>⭐ 가고싶은 곳</h2>
    <button class="btn gold" style="flex:0;padding:9px 16px" onclick="openWishForm()">+ 위시 추가</button></div>
    <div class="wish-summary"><span>🌍 해외 <b>${world}</b></span><span>🇰🇷 국내 <b>${korea}</b></span><span>⭐ 총 <b>${wishes.length}</b></span></div>`;
  if(!wishes.length){
    html+=`<div class="empty-state"><span class="big">⭐</span>가고 싶은 곳을 모아볼까요?<br><small>지도에서 나라를 눌러 담거나 직접 추가할 수 있어요.</small><div class="fab-row"><button class="btn gold" onclick="openWishForm()">첫 위시 추가</button></div></div>`;
  }else{
    html+=`<div class="wish-list">${wishes.map(w=>{
      const who=wishWho(w),dday=wishDday(w.planDate);
      const place=esc(wishName(w));
      const date=w.planDate?`${fmtDate(w.planDate)} · ${dday.label}`:'아직 날짜를 정하지 않았어요';
      return `<article class="wish-card">
        <div class="wish-card-main"><span class="wish-place-icon">${w.scope==='world'?'🌍':'🇰🇷'}</span><div class="wish-copy"><h3>${place}</h3><p><span class="badge ${who.cls}">${who.label}</span> <span class="wish-date ${dday.cls}">${esc(date)}</span></p></div></div>
        <div class="wish-card-actions">
          <button onclick="openWishForm('${w.id}')">${w.planDate?'날짜 수정':'날짜 정하기'}</button>
          <button class="promote" onclick="promoteWish('${w.id}')">✈️ 여행 만들기</button>
          <button class="delete" onclick="deleteWish('${w.id}')" aria-label="${place} 삭제">×</button>
        </div>
      </article>`;
    }).join('')}</div>`;
  }
  scr.innerHTML=html;
}

function openWishForm(id){
  ensureWishDom();
  const w=id?state.wishes.find(x=>x.id===id):null;
  wishForm={editId:id||null,scope:w?w.scope:'world',who:w?w.who:null};
  document.getElementById('wishFormTitle').textContent=w?'위시 수정':'새 위시 추가';
  document.getElementById('wf-date').value=w?w.planDate||'':'';
  document.querySelectorAll('#wf-who .chip').forEach(x=>x.classList.toggle('on',x.dataset.who===wishForm.who));
  renderWishScope();
  renderWishPlaceField(w?w.name:'');
  document.getElementById('wishSheetBg').classList.add('show');
  document.getElementById('wishSheet').classList.add('show');
}
function closeWishForm(){
  document.getElementById('wishSheetBg').classList.remove('show');
  document.getElementById('wishSheet').classList.remove('show');
}
function renderWishScope(){
  document.querySelectorAll('#wf-scope .chip').forEach(x=>x.classList.toggle('on',x.dataset.scope===wishForm.scope));
}
function setWishScope(scope){
  const current=document.getElementById('wf-place')?.value||'';
  wishForm.scope=scope;
  renderWishScope();
  renderWishPlaceField(current);
}
function renderWishPlaceField(value){
  const wrap=document.getElementById('wf-place-wrap');
  if(wishForm.scope==='world'){
    wrap.innerHTML=`<label>나라</label><div class="picker"><input id="wf-place" value="${esc(value)}" placeholder="🔍 나라 검색 (예: 베트남, Japan)" autocomplete="off" oninput="filterWishCountries(this.value)" onfocus="filterWishCountries(this.value)"><div class="picklist" id="wf-picklist"></div></div><div class="hint">지도에 같은 나라가 ⭐ 위시로 표시돼요.</div>`;
  }else{
    wrap.innerHTML=`<label>가고 싶은 곳</label><input id="wf-place" value="${esc(value)}" placeholder="예: 서울, 속초시"><div class="hint">시·군 단위로 입력하면 국내 지도에서도 표시돼요.</div>`;
  }
}
function filterWishCountries(query){
  const box=document.getElementById('wf-picklist');
  const q=(query||'').trim().toLowerCase();
  if(!q){box.classList.remove('show');box.innerHTML='';return;}
  const hits=Object.keys(COUNTRY).filter(eng=>{
    const ko=COUNTRY[eng][0];
    return ko.toLowerCase().includes(q)||eng.toLowerCase().includes(q);
  }).sort((a,b)=>{
    const ap=COUNTRY[a][0].toLowerCase().startsWith(q)?0:1;
    const bp=COUNTRY[b][0].toLowerCase().startsWith(q)?0:1;
    return ap-bp||COUNTRY[a][0].localeCompare(COUNTRY[b][0]);
  });
  box.innerHTML=hits.length?hits.slice(0,20).map(eng=>`<div class="pi" onclick="pickWishCountry('${eng.replace(/'/g,"\\'")}')">${esc(COUNTRY[eng][0])} <small>${esc(eng)}</small></div>`).join(''):'<div class="none">검색 결과가 없어요 🥲</div>';
  box.classList.add('show');
}
function pickWishCountry(country){
  document.getElementById('wf-place').value=COUNTRY[country][0];
  document.getElementById('wf-picklist').classList.remove('show');
}
function setWishWho(who){
  wishForm.who=who;
  document.querySelectorAll('#wf-who .chip').forEach(x=>x.classList.toggle('on',x.dataset.who===who));
}
function saveWish(){
  const input=document.getElementById('wf-place').value.trim();
  if(!input){toast('장소를 입력해주세요');return;}
  if(!wishForm.who){toast('누가 가고 싶은지 골라주세요');return;}
  let name=input;
  if(wishForm.scope==='world'){
    const found=Object.keys(COUNTRY).find(k=>k.toLowerCase()===input.toLowerCase()||COUNTRY[k][0]===input);
    if(!found){toast('검색 목록에서 나라를 선택해주세요');return;}
    name=found;
  }
  if(state.wishes.some(w=>w.id!==wishForm.editId&&w.scope===wishForm.scope&&w.name===name)){
    toast('이미 위시에 담은 곳이에요'); return;
  }
  const planDate=document.getElementById('wf-date').value||null;
  if(wishForm.editId){
    const w=state.wishes.find(x=>x.id===wishForm.editId);
    if(w){Object.assign(w,{scope:wishForm.scope,name,who:wishForm.who,planDate});stamp(w);}
  }else state.wishes.push(stamp({id:uid('w'),scope:wishForm.scope,name,who:wishForm.who,planDate}));
  persist(); closeWishForm(); renderWish(); toast(wishForm.editId?'위시를 수정했어요':'위시에 담았어요 ⭐');
}
function deleteWish(id){
  const w=state.wishes.find(x=>x.id===id); if(!w) return;
  if(!confirm(`"${wishName(w)}"을(를) 위시에서 뺄까요?`)) return;
  markDeleted(id); state.wishes=state.wishes.filter(x=>x.id!==id);
  persist(); renderWish(); toast('위시에서 뺐어요');
}
function promoteWish(id){
  const w=state.wishes.find(x=>x.id===id); if(!w) return;
  const place=wishName(w);
  switchTab('trips');
  openTripForm(null,{
    name:`${place} 여행`,
    countries:w.scope==='world'?[w.name]:['South Korea'],
    startDate:w.planDate||'', endDate:'', wishId:w.id
  });
  toast('종료일을 입력하고 여행을 만들어주세요 ✈️');
}

function ensureWishDom(){
  if(document.getElementById('wishSheet')) return;
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="sheet-bg" id="wishSheetBg" onclick="closeWishForm()"></div>
  <div class="sheet" id="wishSheet"><div class="grab"></div><div class="body"><h2 id="wishFormTitle">새 위시 추가</h2><div class="form">
    <label>어디로 갈까요?</label><div class="chips" id="wf-scope"><button class="chip both" data-scope="world" onclick="setWishScope('world')">🌍 해외</button><button class="chip pt" data-scope="korea" onclick="setWishScope('korea')">🇰🇷 국내</button></div>
    <div id="wf-place-wrap"></div>
    <label>누가 가고 싶어 하나요?</label><div class="chips" id="wf-who"><button class="chip me" data-who="me" onclick="setWishWho('me')">🧑 ${CONFIG.NAME_ME}</button><button class="chip pt" data-who="partner" onclick="setWishWho('partner')">👩 ${CONFIG.NAME_PARTNER}</button><button class="chip both" data-who="both" onclick="setWishWho('both')">💕 같이</button></div>
    <label>가고 싶은 날짜 (선택)</label><input id="wf-date" type="date"><div class="hint">날짜를 정하면 홈과 위시에서 D-day를 볼 수 있어요.</div>
    <div class="btnrow"><button class="btn ghost" onclick="closeWishForm()">취소</button><button class="btn gold" onclick="saveWish()">저장</button></div>
  </div></div></div>`;
  document.body.appendChild(wrap);
}
</script>
<script>
/* ═══════════════════════════════════════════════
   review.js — 📝 여행 후기 서브탭
   후기 미작성 → 입력폼 / 작성됨 → 후기 뷰(수정 버튼)
   ═══════════════════════════════════════════════ */

let reviewRating=0;
let reviewEditTripId=null;   // 이 여행에 한해 수정모드

function safeReviewUrl(value){
  if(!value) return '';
  try{ const url=new URL(value); return ['http:','https:'].includes(url.protocol)?url.href:''; }
  catch(e){ return ''; }
}
function reviewStars(rating){ return '⭐'.repeat(rating)+'☆'.repeat(5-rating); }
function reviewHasContent(r){ return !!(r && (r.done || r.rating>0 || (r.blog||'').trim() || (r.album||'').trim() || (r.memo||'').trim())); }

function renderReview(trip,body){
  const review=Object.assign({blog:'',album:'',memo:'',rating:0,done:false},trip.review||{});
  const editing = reviewEditTripId===trip.id || !reviewHasContent(review);
  editing ? renderReviewForm(trip,review,body) : renderReviewView(trip,review,body);
}

/* ── 읽기 뷰 ── */
function renderReviewView(trip,review,body){
  const blog=safeReviewUrl(review.blog), album=safeReviewUrl(review.album);
  const links=[];
  if(blog) links.push(`<a class="review-link" href="${esc(blog)}" target="_blank" rel="noopener">✍️ 블로그/여행기 <span>열기 ↗</span></a>`);
  if(album) links.push(`<a class="review-link" href="${esc(album)}" target="_blank" rel="noopener">📷 공유 앨범 <span>열기 ↗</span></a>`);
  body.innerHTML=`<div class="review-wrap">
    <section class="review-hero ${review.done?'done':''}">
      <span>${review.done?'🎉':'📝'}</span>
      <div><h3>${esc(trip.name)||'여행'} 후기</h3><p>${review.rating?reviewStars(review.rating)+'  '+review.rating+'점':'별점 미입력'}</p></div>
    </section>
    ${links.length?`<section class="review-links">${links.join('')}</section>`:''}
    ${review.memo?`<section class="review-read-memo">${esc(review.memo)}</section>`:''}
    <div class="btnrow"><button class="btn ghost" onclick="editReview('${trip.id}')">✏️ 후기 수정</button></div>
  </div>`;
}
function editReview(tripId){ reviewEditTripId=tripId; renderTripDetail(); }

/* ── 입력 폼 ── */
function renderReviewForm(trip,review,body){
  reviewRating=Math.max(0,Math.min(5,+review.rating||0));
  const has=reviewHasContent(review);
  body.innerHTML=`<div class="review-wrap">
    <section class="review-hero">
      <span>📝</span><div><h3>여행의 순간을 남겨봐요</h3><p>다녀온 뒤 별점과 한 줄 메모를 남겨보세요.</p></div>
    </section>
    <section class="review-form form">
      <label>블로그 / 여행기 링크</label><input id="rv-blog" type="url" inputmode="url" value="${esc(review.blog)}" placeholder="https://blog.example.com/travel">
      <label>공유 앨범 링크</label><input id="rv-album" type="url" inputmode="url" value="${esc(review.album)}" placeholder="https://photos.app.goo.gl/...">
      <label>이번 여행의 별점</label><div class="review-stars" id="reviewStars">${[1,2,3,4,5].map(n=>`<button class="${n<=reviewRating?'on':''}" onclick="setReviewRating(${n})" aria-label="${n}점">⭐</button>`).join('')}</div>
      <label>한 줄 메모</label><textarea id="rv-memo" rows="4" placeholder="예: 다음에도 꼭 다시 가고 싶은 여행!">${esc(review.memo)}</textarea>
      <label class="review-done"><input id="rv-done" type="checkbox"${review.done?' checked':''}><span>후기 작성 완료</span></label>
      <div class="btnrow">
        ${has?`<button class="btn ghost" onclick="cancelReview('${trip.id}')">취소</button>`:''}
        <button class="btn primary" onclick="saveReview('${trip.id}')">후기 저장</button>
      </div>
    </section>
  </div>`;
}
function setReviewRating(rating){
  reviewRating=rating;
  document.querySelectorAll('#reviewStars button').forEach((button,index)=>button.classList.toggle('on',index<rating));
}
function cancelReview(tripId){ reviewEditTripId=null; renderTripDetail(); }
function saveReview(tripId){
  const trip=getTrip(tripId); if(!trip) return;
  const blog=document.getElementById('rv-blog').value.trim();
  const album=document.getElementById('rv-album').value.trim();
  if((blog&&!safeReviewUrl(blog))||(album&&!safeReviewUrl(album))){
    toast('링크는 http:// 또는 https:// 주소로 입력해주세요'); return;
  }
  trip.review={
    blog, album,
    memo:document.getElementById('rv-memo').value.trim(),
    rating:reviewRating,
    done:document.getElementById('rv-done').checked
  };
  stamp(trip); persist();
  reviewEditTripId=null;      // 저장 후 읽기 뷰로
  renderTripDetail();
  toast('여행 후기를 저장했어요 📝');
}
</script>
</body>
</html>
