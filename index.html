<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>우리 여행 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --me:#B06B6B; --me-soft:#D9BFBF;      /* 윤호 = 회색빛 레드 */
  --pt:#6B84B0; --pt-soft:#BFCADB;      /* 가진 = 회색빛 블루 */
  --both:#5FAE7E; --both-soft:#BFE0CD;  /* 같이 = 초록 */
  --wish:#EBD98A; --wish-line:#CBB85C;  /* 위시 = 옅은 노랑 */
  --red:#B06B6B; --blue:#6B84B0;        /* 하위호환 별칭 */
  --gold:#CBB85C;
  --bg:#FFF9F2; --card:#FFFFFF;
  --text:#5C4948; --sub:#B0A09E; --line:#F0E5DC;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Gowun Dodum',sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;background:#fff;color:var(--text)}
input:focus,textarea:focus{outline:none;border-color:var(--blue-soft)}

/* ── PIN 잠금 ── */
#lock{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#lock .logo{font-size:44px}
#lock h1{font-size:26px}
#lock .dots{display:flex;gap:14px;height:16px}
#lock .dot{width:14px;height:14px;border-radius:50%;background:var(--line);transition:background .15s}
#lock .dot.on{background:var(--red)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:8px}
#lock .pad button{height:60px;border-radius:20px;background:var(--card);font-size:22px;font-family:'Jua';box-shadow:0 2px 8px rgba(92,73,72,.07)}
#lock .pad button:active{background:var(--line)}
#lock .msg{color:var(--red);font-size:13px;height:16px}

/* ── 헤더/통계 ── */
#app{display:none;flex-direction:column;height:100%}
header{padding:14px 16px 8px;flex-shrink:0}
header .top{display:flex;align-items:center;justify-content:space-between}
header h1{font-size:22px}
#stats{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
#stats::-webkit-scrollbar{display:none}
.stat{flex-shrink:0;background:var(--card);cursor:pointer;border-radius:14px;padding:7px 12px;font-size:12.5px;box-shadow:0 1px 5px rgba(92,73,72,.06);white-space:nowrap}
.stat b{font-family:'Jua';font-size:14px}
#syncdot{font-size:11px;color:var(--sub)}
#searchbar{position:relative;margin-top:8px;display:none;width:100%}
#searchbar.show{display:block!important}
#searchBtn{background:var(--card);border-radius:10px;width:34px;height:32px;font-size:15px;box-shadow:0 1px 4px rgba(92,73,72,.1);cursor:pointer;flex-shrink:0}
#searchBtn.on{background:var(--me);}
#searchInput{font-size:14px;padding:9px 12px;border-radius:12px;background:#fff;width:100%;box-sizing:border-box}
#searchList{position:absolute;left:0;right:0;top:44px;z-index:600;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(92,73,72,.18);max-height:260px;overflow-y:auto;display:none}
#searchList.show{display:block}
#searchList .si{padding:11px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;cursor:pointer}
#searchList .si:last-child{border-bottom:none}
#searchList .si:active{background:var(--bg)}
#searchList .si .tag{margin-left:auto;font-size:11px;color:#fff;border-radius:8px;padding:2px 8px}
#searchList .none{padding:14px;text-align:center;color:var(--sub);font-size:13px}
.hdr-right{display:flex;align-items:center;gap:8px}
#ddayBadge{background:var(--both);color:#fff;border-radius:12px;padding:6px 12px;font-family:'Jua';font-size:14px;box-shadow:0 2px 6px rgba(95,174,126,.35);line-height:1.15;text-align:center}
#ddayBadge small{display:block;font-size:9.5px;opacity:.9;font-family:'Gowun Dodum'}
.plan-card{background:#EAF6EF;border:1.5px solid var(--both-soft);border-radius:16px;padding:12px 14px;margin-top:10px}
.plan-card .pc1{font-family:'Jua';font-size:16px;color:#3E7D5A}
.plan-card .pc1 b{color:var(--both);font-size:18px}
.plan-card .pc2{font-size:12.5px;color:var(--sub);margin-top:2px}
.plan-card .actions{display:flex;gap:12px;margin-top:8px}
.plan-card .actions button{font-size:12px;color:#5C8A72}

/* ── 지도 ── */
#mapwrap{flex:1;position:relative;z-index:0;border-radius:20px 20px 0 0;overflow:hidden;margin:6px 8px 0;box-shadow:0 -2px 12px rgba(92,73,72,.05)}
#map{position:absolute;inset:0;background:#EAF4FA}
#legend{position:absolute;left:10px;bottom:12px;z-index:500;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 11px;box-shadow:0 2px 8px rgba(92,73,72,.15);font-size:12px;display:flex;flex-direction:column;gap:5px}
#legend .lg{display:flex;align-items:center;gap:7px;color:var(--text)}
#legend .sw{width:13px;height:13px;border-radius:4px;flex-shrink:0}
.leaflet-container{font-family:'Gowun Dodum'}
/* 나라 이름 = 대표 라벨 (진하고 큼, Jua 폰트) */
.name-label{background:rgba(255,255,255,.92);border:none;border-radius:9px;padding:2px 9px;font-size:12.5px;color:var(--text);box-shadow:0 2px 6px rgba(92,73,72,.18);white-space:nowrap;font-family:'Jua';font-weight:400;text-align:center;line-height:1.25}
.name-label:before{display:none}
.name-label.clickable{cursor:pointer}
/* 왕관(2회 이상 방문) 나라 = 20% 크게 + 금테 + 반짝 애니메이션 */
.name-label.crown{font-size:15px;padding:3px 11px;background:linear-gradient(135deg,#FFF7E0,#FFEFC2);border:1.5px solid var(--wish-line);box-shadow:0 2px 10px rgba(203,184,92,.45);animation:crownPulse 2.2s ease-in-out infinite}
.name-label.crown .cr{filter:drop-shadow(0 1px 1px rgba(180,140,20,.5))}
@keyframes crownPulse{0%,100%{transform:scale(1);box-shadow:0 2px 10px rgba(203,184,92,.4)}50%{transform:scale(1.06);box-shadow:0 3px 16px rgba(203,184,92,.7)}}
/* 도시 이름 = 하위 라벨 (작고 가벼움, 둥근 알약, Gowun) */
.city-pin{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.city-marker{display:flex;flex-direction:column;align-items:center}
.city-dot{width:9px;height:9px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.city-name{margin-top:2px;background:rgba(255,255,255,.82);border-radius:10px;padding:0 6px;font-size:9.5px;color:var(--sub);white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.1);font-family:'Gowun Dodum';border:.5px solid var(--line)}

/* ── 하단 탭 ── */
nav{display:flex;background:var(--card);border-top:1.5px solid var(--line);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 8px;font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:21px}
nav button.on{color:var(--red)}

/* ── 바텀시트 ── */
.sheet-bg{position:fixed;inset:0;background:rgba(92,73,72,.35);z-index:100;display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:-100%;max-height:82%;background:var(--bg);border-radius:24px 24px 0 0;z-index:101;transition:bottom .25s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{bottom:0}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 4px;flex-shrink:0}
.sheet .body{overflow-y:auto;padding:8px 18px 24px}
.sheet h2{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.badge{font-size:11px;padding:3px 9px;border-radius:10px;color:#fff;font-family:'Gowun Dodum'}
.badge.me{background:var(--me)} .badge.pt{background:var(--pt)} .badge.both{background:var(--both)} .badge.wish{background:var(--wish-line)} .badge.none{background:var(--sub)}

/* 기록 카드 */
.rec{background:var(--card);border-radius:16px;padding:12px 14px;margin-top:10px;box-shadow:0 1px 6px rgba(92,73,72,.06)}
.rec .r1{display:flex;align-items:center;justify-content:space-between}
.rec .city{font-family:'Jua';font-size:16px}
.rec .who{font-size:11.5px;color:#fff;border-radius:9px;padding:2px 8px}
.rec .meta{font-size:12.5px;color:var(--sub);margin-top:3px}
.rec .memo{font-size:14px;margin-top:6px;line-height:1.45}
.rec a{color:var(--blue);font-size:13px;text-decoration:none}
.rec .actions{display:flex;gap:12px;margin-top:8px}
.rec .actions button{font-size:12px;color:var(--sub)}

/* 버튼 */
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:13px;border-radius:14px;font-family:'Jua';font-size:15px;text-align:center}
.btn.primary{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
.btn.gold{background:#FDF3DC;color:#B8860B;border:1.5px solid var(--gold)}
.btn:active{opacity:.85}

/* 폼 */
.form label{display:block;font-size:13px;color:var(--sub);margin:14px 0 5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:14px}
.chip.on.me{background:var(--me);border-color:var(--me);color:#fff}
.chip.on.pt{background:var(--pt);border-color:var(--pt);color:#fff}
.chip.on.both{background:var(--both);border-color:var(--both);color:#fff}
.stars{display:flex;gap:6px;font-size:28px}
.stars span{filter:grayscale(1);opacity:.4}
.stars span.on{filter:none;opacity:1}
.geo-result{background:#F3F8FF;border:1.5px solid var(--blue-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px;display:none}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}

/* 기록 전체 탭 */
#listview{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
#listview.show{display:flex}
#listview .lhead{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center}
#listview .lbody{flex:1;overflow-y:auto;padding:0 16px 90px}
.yearhead{font-family:'Jua';font-size:17px;margin:16px 4px 2px;color:var(--red)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--text);color:#fff;padding:10px 18px;border-radius:14px;font-size:13.5px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;max-width:85%;text-align:center}
.toast.show{opacity:1}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- 잠금 화면 -->
<div id="lock">
  <div class="logo">🗺️💕</div>
  <h1>우리 여행 지도</h1>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="msg" id="lockmsg"></div>
  <div class="pad">
    <button onclick="pinKey(1)">1</button><button onclick="pinKey(2)">2</button><button onclick="pinKey(3)">3</button>
    <button onclick="pinKey(4)">4</button><button onclick="pinKey(5)">5</button><button onclick="pinKey(6)">6</button>
    <button onclick="pinKey(7)">7</button><button onclick="pinKey(8)">8</button><button onclick="pinKey(9)">9</button>
    <button></button><button onclick="pinKey(0)">0</button><button onclick="pinKey(-1)">⌫</button>
  </div>
</div>

<!-- 앱 본체 -->
<div id="app">
  <header>
    <div class="top">
      <h1 id="title">🌍 우리 여행 지도</h1>
      <div class="hdr-right">
        <button id="ddayBadge" onclick="openPlanList()" style="display:none"></button>
        <button id="searchBtn" onclick="toggleSearch()">🔍</button>
        <span id="syncdot">●</span>
      </div>
    </div>
    <div id="stats"></div>
    <div id="searchbar">
      <input id="searchInput" placeholder="🔍 나라 검색 (예: 터키, 일본)" autocomplete="off"
        oninput="onSearch(this.value)" onfocus="onSearch(this.value)">
      <div id="searchList"></div>
    </div>
  </header>
  <div id="mapwrap"><div id="map"></div>
    <div id="legend">
      <div class="lg"><span class="sw" style="background:#B06B6B"></span>윤호</div>
      <div class="lg"><span class="sw" style="background:#6B84B0"></span>가진</div>
      <div class="lg"><span class="sw" style="background:#5FAE7E"></span>같이</div>
      <div class="lg"><span class="sw" style="background:#EBD98A;border:1px dashed #CBB85C"></span>위시</div>
    </div>
  </div>
  <nav>
    <button id="tab-world" class="on" onclick="switchTab('world')"><span class="ic">🌍</span>세계</button>
    <button id="tab-korea" onclick="switchTab('korea')"><span class="ic">🇰🇷</span>한국</button>
    <button id="tab-list" onclick="openList()"><span class="ic">📖</span>기록</button>
  </nav>
</div>

<!-- 나라/지역 상세 시트 -->
<div class="sheet-bg" id="sheetbg" onclick="closeSheets()"></div>
<div class="sheet" id="detailSheet">
  <div class="grab"></div>
  <div class="body" id="detailBody"></div>
</div>

<!-- 기록 추가/수정 시트 -->
<div class="sheet" id="formSheet">
  <div class="grab"></div>
  <div class="body">
    <h2 id="formTitle">기록 추가</h2>
    <div class="form">
      <div id="cityField">
        <label>도시 이름</label>
        <div style="display:flex;gap:8px">
          <input id="f-city" placeholder="예: 이스탄불, Kota Kinabalu" oninput="geoPick=null;document.getElementById('geoResult').style.display='none'">
          <button class="btn ghost" style="flex:0 0 76px;padding:10px" onclick="geocodeCity()">찾기</button>
        </div>
        <div class="geo-result" id="geoResult"></div>
        <div class="hint">도시 이름을 입력하고 <b>[찾기]를 꼭 눌러</b> 위치를 확인해야 저장돼요. 한글/영문 모두 가능!</div>
      </div>
      <label>누가 다녀왔나요?</label>
      <div class="chips" id="whoChips">
        <button class="chip me" data-who="me" onclick="setWho('me')">나 (윤호)</button>
        <button class="chip pt" data-who="partner" onclick="setWho('partner')">가진</button>
        <button class="chip both" data-who="both" onclick="setWho('both')">같이 💕</button>
      </div>
      <label>언제?</label>
      <input id="f-date" type="month">
      <label>별점</label>
      <div class="stars" id="starRow">
        <span onclick="setStar(1)">⭐</span><span onclick="setStar(2)">⭐</span><span onclick="setStar(3)">⭐</span><span onclick="setStar(4)">⭐</span><span onclick="setStar(5)">⭐</span>
      </div>
      <label>한 줄 소감</label>
      <input id="f-memo" placeholder="예: 여기 물회 미쳤음">
      <label>구글포토 앨범 링크 (선택)</label>
      <input id="f-link" placeholder="https://photos.app.goo.gl/...">
      <div class="btnrow">
        <button class="btn ghost" onclick="closeSheets()">취소</button>
        <button class="btn primary" id="saveBtn" onclick="saveRecord()">저장하기</button>
      </div>
    </div>
  </div>
</div>

<!-- 기록 전체 리스트 -->
<div id="listview">
  <div class="lhead"><h1 style="font-size:22px">📖 우리의 기록</h1><button class="btn ghost" style="flex:0;padding:8px 16px" onclick="closeList()">닫기</button></div>
  <div class="lbody" id="listBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>

/* 검색: 한글/영문 입력 → 나라 목록 */
function onSearch(q){
  const box = document.getElementById('searchList');
  q = (q||'').trim().toLowerCase();
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }

  if(curTab==='world'){
    const hits = [];
    for(const eng in COUNTRY){
      const ko = COUNTRY[eng][0];
      if(ko.toLowerCase().includes(q) || eng.toLowerCase().includes(q)) hits.push({eng, ko});
    }
    hits.sort((a,b)=>{
      const ap=a.ko.toLowerCase().startsWith(q)?0:1, bp=b.ko.toLowerCase().startsWith(q)?0:1;
      return ap-bp || a.ko.localeCompare(b.ko);
    });
    if(!hits.length){ box.innerHTML='<div class="none">검색 결과가 없어요 🥲</div>'; box.classList.add('show'); return; }
    box.innerHTML = hits.slice(0,20).map(hu=>{
      const recs=recsFor('world',hu.eng), wish=isWish('world',hu.eng); let tag='';
      if(recs.some(r=>r.who==='both')) tag='<span class="tag" style="background:var(--both)">같이</span>';
      else if(recs.length) tag='<span class="tag" style="background:var(--me)">다녀옴</span>';
      else if(wish) tag='<span class="tag" style="background:var(--wish-line)">위시</span>';
      return `<div class="si" onclick="pickSearch('world','${hu.eng.replace(/'/g,"\\'")}')">🌍 ${hu.ko}${tag}</div>`;
    }).join('');
    box.classList.add('show');
  } else {
    // 한국: KR_CENTER의 시·군 이름으로 검색
    const units = Object.keys(KR_CENTER);
    if(!units.length){ box.innerHTML='<div class="none">지도를 불러오는 중이에요… 잠시 후 다시 검색해주세요</div>'; box.classList.add('show'); return; }
    const hits = units.filter(u=>u.toLowerCase().includes(q));
    hits.sort((a,b)=>{
      const ap=a.toLowerCase().startsWith(q)?0:1, bp=b.toLowerCase().startsWith(q)?0:1;
      return ap-bp || a.localeCompare(b);
    });
    if(!hits.length){ box.innerHTML='<div class="none">검색 결과가 없어요 🥲</div>'; box.classList.add('show'); return; }
    box.innerHTML = hits.slice(0,20).map(u=>{
      const recs=recsFor('korea',u), wish=isWish('korea',u); let tag='';
      if(recs.some(r=>r.who==='both')) tag='<span class="tag" style="background:var(--both)">같이</span>';
      else if(recs.length) tag='<span class="tag" style="background:var(--me)">다녀옴</span>';
      else if(wish) tag='<span class="tag" style="background:var(--wish-line)">위시</span>';
      return `<div class="si" onclick="pickSearch('korea','${u.replace(/'/g,"\\'")}')">🇰🇷 ${u}${tag}</div>`;
    }).join('');
    box.classList.add('show');
  }
}

async function loadData(){
  if(CONFIG.API_URL){
    try{
      setSync('sync');
      const r = await fetch(CONFIG.API_URL, {method:'POST', body: JSON.stringify({action:'load', pin: CONFIG.PIN})});
      const j = await r.json();
      if(j.ok){ state = j.data; setSync('ok'); return; }
      throw new Error(j.error||'load fail');
    }catch(e){ setSync('err'); toast('불러오기 실패 — 저장된 내용으로 표시해요'); }
  }
  const local = localStorage.getItem('tm_state');
  if(local) state = JSON.parse(local);
  setSync(CONFIG.API_URL ? 'err' : 'local');
}
let saveTimer = null;
function persist(){
  localStorage.setItem('tm_state', JSON.stringify(state));
  if(!CONFIG.API_URL) return;
  setSync('sync');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      const r = await fetch(CONFIG.API_URL, {method:'POST', body: JSON.stringify({action:'save', pin: CONFIG.PIN, data: state})});
      const j = await r.json();
      setSync(j.ok ? 'ok' : 'err');
    }catch(e){ setSync('err'); }
  }, 600);
}
function setSync(s){
  const el = document.getElementById('syncdot');
  if(s==='ok'){ el.textContent='● 공유중'; el.style.color='#7BC49A'; }
  else if(s==='sync'){ el.innerHTML='<span class="spin">↻</span> 저장중'; el.style.color='var(--sub)'; }
  else if(s==='err'){ el.textContent='● 오프라인'; el.style.color='var(--gold)'; }
  else { el.textContent='● 내 폰에만 저장'; el.style.color='var(--sub)'; }
}

async function loadWorld(){
  if(!worldGeoData){
    toast('세계 지도를 불러오는 중… 🌍 (처음 한 번만 몇 초 걸려요)');
    const r = await fetch(WORLD_TOPO);
    const topo = await r.json();
    worldGeoData = topojson.feature(topo, topo.objects.countries);
    // 남극은 제외 (렌더링 문제 + 여행 기록 대상 아님)
    worldGeoData.features = worldGeoData.features.filter(f=>f.properties.name !== 'Antarctica');
    worldGeoData.features.forEach(f=>{
      const raw = f.properties.name;
      f.properties.name = ALIAS[raw] || raw;      // 이름 체계 통일
      fixAntimeridian(f);                          // 날짜변경선 가로줄 보정
      try{
        const c = COUNTRY[f.properties.name];
        // 사전에 수도좌표가 있으면 무조건 그걸 사용 (무게중심 계산이 분단국가에서 오작동하는 것 방지)
        let pos;
        if(c && c.length>2 && Math.abs(c[1])<=85 && Math.abs(c[2])<=180){
          pos = L.latLng(c[1], c[2]);
        } else {
          pos = countryLabelPos(f);
          if(!pos || pos.lat<-60 || pos.lat>85 || pos.lng<-180 || pos.lng>180) pos = null;
        }
        if(pos) WORLD_CENTER[f.properties.name] = pos;
      }catch(e){}
    });
  }
}
/* 경도 180도(날짜변경선)를 걸치는 도형이 지도를 가로지르는 선으로 그려지는 것 방지 */
function fixAntimeridian(f){
  const g = f.geometry;
  if(!g) return;
  const polys = g.type === 'Polygon' ? [g.coordinates] : (g.type === 'MultiPolygon' ? g.coordinates : []);
  polys.forEach(rings=>{
    rings.forEach(ring=>{
      let min = 180, max = -180;
      for(const pt of ring){ if(pt[0] < min) min = pt[0]; if(pt[0] > max) max = pt[0]; }
      if(max - min > 180){            // 한 도형이 지도 양끝에 걸쳐 있음 → 서쪽 좌표를 동쪽으로 이어붙임
        for(const pt of ring){ if(pt[0] < 0) pt[0] += 360; }
      }
    });
  });
}

function countryLabelPos(f){
  const fix = LABEL_FIX[f.properties.name];
  if(fix) return L.latLng(fix[0], fix[1]);
  const g = f.geometry;
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
  let best = null, bestArea = -1;
  polys.forEach(p=>{
    const ring = p[0]; // 바깥 테두리
    let area = 0, cx = 0, cy = 0;
    for(let i=0; i<ring.length-1; i++){
      const [x1,y1] = ring[i], [x2,y2] = ring[i+1];
      const cross = x1*y2 - x2*y1;
      area += cross; cx += (x1+x2)*cross; cy += (y1+y2)*cross;
    }
    area /= 2;
    const abs = Math.abs(area);
    if(abs > bestArea && abs > 0){
      const la = cy/(6*area), ln = cx/(6*area);
      if(la>=-60 && la<=85 && ln>=-180 && ln<=180){   // 정상 범위만 채택
        bestArea = abs;
        best = L.latLng(la, ln);
      }
    }
  });
  return best || L.geoJSON(f).getBounds().getCenter();
}
async function loadKorea(){
  if(!koreaGeoData){
    toast('한국 지도를 불러오는 중… 🚚');
    const r = await fetch(KOREA_GEO); koreaGeoData = await r.json();
    koreaGeoData.features.forEach(f=>{
      const code = String(f.properties.code||'');
      const pref = code.slice(0,2);
      let unit = METRO[pref] || f.properties.name;
      // 일반구는 시 단위로 통합: "수원시장안구" → "수원시"
      if(!METRO[pref]){
        const m = String(unit).match(/^(.+?시)./);
        if(m && unit.endsWith('구')) unit = m[1];
      }
      f.properties.unit = unit;
    });
    // 지역(색칠 단위)별 중심좌표 미리 계산 — 이름 라벨용
    const groups = {};
    koreaGeoData.features.forEach(f=>{
      (groups[f.properties.unit] = groups[f.properties.unit] || []).push(f);
    });
    Object.keys(groups).forEach(u=>{
      // 여러 조각 중 가장 큰 땅의 무게중심 (섬 때문에 라벨이 바다로 빠지는 것 방지)
      let best=null, bestArea=-1;
      groups[u].forEach(f=>{
        const geom=f.geometry;
        const polys = geom.type==='Polygon' ? [geom.coordinates] : (geom.type==='MultiPolygon'? geom.coordinates : []);
        polys.forEach(pp=>{
          const ring=pp[0]; let area=0,cx=0,cy=0;
          for(let i=0;i<ring.length-1;i++){const [x1,y1]=ring[i],[x2,y2]=ring[i+1];const cr=x1*y2-x2*y1;area+=cr;cx+=(x1+x2)*cr;cy+=(y1+y2)*cr;}
          area/=2; const abs=Math.abs(area);
          if(abs>bestArea&&abs>0){bestArea=abs; best=L.latLng(cy/(6*area),cx/(6*area));}
        });
      });
      KR_CENTER[u] = best || L.geoJSON({type:'FeatureCollection', features:groups[u]}).getBounds().getCenter();
    });
  }
}

/* ── 상태 계산 ── */
function recsFor(scope, name){
  return state.records.filter(r => r.scope===scope && (scope==='world' ? r.country===name : r.city===name));
}
function unitStatus(scope, name){
  const recs = recsFor(scope, name);
  if(!recs.length) return null;
  return recs.some(r=>r.who==='both') ? 'both' : 'solo';
}
function unitNames(scope, name){
  const recs = recsFor(scope, name);
  const s = new Set();
  recs.forEach(r=>{
    if(r.who==='me') s.add(CONFIG.NAME_ME);
    else if(r.who==='partner') s.add(CONFIG.NAME_PARTNER);
    else { s.add(CONFIG.NAME_ME); s.add(CONFIG.NAME_PARTNER); }
  });
  return [...s].join('·');
}
function tripCount(scope, name){
  // 방문 횟수 = 그 나라/도시의 기록 개수 (날짜 유무와 무관)
  return recsFor(scope, name).length;
}
function isWish(scope, name){
  return state.wishes.some(w=>w.scope===scope && w.name===name);
}

/* ── 렌더 ── */
function renderAll(){ renderStats(); renderMap(); renderDday(); }
function upcomingPlans(){
  const today = new Date(); today.setHours(0,0,0,0);
  return state.wishes.filter(w=>w.planDate && w.scope===curTab)   // 현재 탭(세계/한국)만
    .map(w=>({...w, days: Math.round((new Date(w.planDate+'T00:00:00')-today)/86400000)}))
    .filter(w=>w.days >= 0)
    .sort((a,b)=>a.days-b.days);
}
function renderDday(){
  const badge = document.getElementById('ddayBadge');
  const plans = upcomingPlans();
  if(!plans.length){ badge.style.display='none'; return; }
  const n = plans[0];
  const dd = n.days===0 ? 'D-DAY' : 'D-'+n.days;
  badge.style.display='block';
  badge.innerHTML = `${dd}<small>${n.name}${plans.length>1?' 외 '+(plans.length-1):''}</small>`;
}
function openPlanList(){
  const plans = upcomingPlans();
  if(!plans.length) return;
  let html = `<h2>✈️ 다가오는 ${curTab==='korea'?'국내 ':''}여행</h2>`;
  plans.forEach(p=>{
    const dd = p.days===0 ? 'D-DAY' : 'D-'+p.days;
    html += `<div class="rec" onclick="closeSheets();highlight('${p.scope}','${p.name.replace(/'/g,"\\'")}');openDetail('${p.scope}','${p.name.replace(/'/g,"\\'")}')" style="cursor:pointer">
      <div class="r1"><span class="city">${p.scope==='korea'?'🇰🇷 ':''}${p.name}</span><span class="who" style="background:var(--both)">${dd}</span></div>
      <div class="meta">${p.planDate} 예정</div>
    </div>`;
  });
  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('sheetbg').classList.add('show');
  document.getElementById('detailSheet').classList.add('show');
}
function styleFor(scope, name){
  const recs = recsFor(scope, name);
  const wish = isWish(scope, name);
  let s;
  if(recs.length){
    const both = recs.some(r=>r.who==='both');
    const me = recs.some(r=>r.who==='me');
    const pt = recs.some(r=>r.who==='partner');
    if(both) s = {fillColor:'#5FAE7E', fillOpacity:.72, color:'#fff', weight:.7};        // 같이 = 초록
    else if(me && pt) s = {fillColor:'#8A7B9E', fillOpacity:.68, color:'#fff', weight:.7};// 둘 다 따로 = 보라
    else if(me) s = {fillColor:'#B06B6B', fillOpacity:.70, color:'#fff', weight:.7};      // 윤호 = 레드그레이
    else s = {fillColor:'#6B84B0', fillOpacity:.70, color:'#fff', weight:.7};             // 가진 = 블루그레이
  }
  else if(wish) s = {fillColor:'#EBD98A', fillOpacity:.6, color:'#CBB85C', weight:1.3, dashArray:'4'};
  else s = {fillColor:'#DCD2C8', fillOpacity: scope==='world' ? .35 : .5, color:'#fff', weight:.6};
  if(name === selName){
    s.weight = 3.5; s.color = '#5C4948';
    if(!recs.length && !wish){ s.fillColor = '#FFD97A'; s.fillOpacity = .55; }
    else { s.fillOpacity = Math.min((s.fillOpacity||0.5)+.2, .95); }
  }
  return s;
}
function highlight(scope, name){
  selName = name;
  const lay = scope==='world' ? worldLayer : koreaLayer;
  if(!lay) return;
  lay.eachLayer(l=>{
    const n = scope==='world' ? l.feature.properties.name : l.feature.properties.unit;
    l.setStyle(styleFor(scope, n));
    if(n === name && l.bringToFront) l.bringToFront();
  });
}
function renderMap(){
  markerGroup.clearLayers(); labelGroup.clearLayers(); unitLabelGroup.clearLayers();
  if(worldLayer){ map.removeLayer(worldLayer); worldLayer=null; }
  if(koreaLayer){ map.removeLayer(koreaLayer); koreaLayer=null; }

  if(curTab==='world'){
    map.setMinZoom(2); map.setMaxZoom(10);
    worldLayer = L.geoJSON(worldGeoData, {
      style: f => styleFor('world', f.properties.name),
      onEachFeature: (f, layer) => {
        layer.on('click', ()=>{ highlight('world', f.properties.name); openDetail('world', f.properties.name, layer); });
      }
    }).addTo(map);
    if(!map._setView){ map.setView([25,60], 2); map._setView = true; }
    renderWorldLabels();
    // 도시별 그룹핑 (같은 도시 여러 기록 → 마커 하나)
    const cityMap = {};
    state.records.filter(r=>r.scope==='world' && r.lat).forEach(r=>{
      const key = r.country+'|'+r.city;
      (cityMap[key] = cityMap[key] || {city:r.city, country:r.country, lat:r.lat, lng:r.lng, recs:[]}).recs.push(r);
    });
    Object.values(cityMap).forEach(c=>{
      const both = c.recs.some(r=>r.who==='both');
      const me = c.recs.some(r=>r.who==='me');
      const color = both ? '#4C9068' : (me && c.recs.some(r=>r.who==='partner')) ? '#6E5F82' : me ? '#8F5555' : '#556E96';
      const m = L.marker([c.lat, c.lng], {icon: L.divIcon({
        className:'city-marker',
        html:`<div class="city-dot" style="background:${color}"></div><div class="city-name">${esc(c.city)}</div>`,
        iconSize:null, iconAnchor:[5,5]})});
      m.on('click', ()=>{ highlight('world', c.country); openDetail('world', c.country); });
      m.addTo(markerGroup);
    });
  } else {
    map.setMinZoom(6); map.setMaxZoom(12);
    koreaLayer = L.geoJSON(koreaGeoData, {
      style: f => styleFor('korea', f.properties.unit),
      onEachFeature: (f, layer) => {
        layer.on('click', ()=>{ highlight('korea', f.properties.unit); openDetail('korea', f.properties.unit, layer); });
      }
    }).addTo(map);
    map.setView([36.3, 127.8], 7);
    renderKoreaUnitLabels();
  }
}
/* 세계 한글 나라명 라벨: 기본은 방문/위시+큰 나라, 확대할수록 전체 표시 */
function renderWorldLabels(){
  labelGroup.clearLayers();
  if(curTab!=='world' || !worldGeoData) return;
  const z = map.getZoom();
  worldGeoData.features.forEach(f=>{
    const name = f.properties.name;
    const center = WORLD_CENTER[name];
    if(!center) return;
    const st = unitStatus('world', name);
    const wish = isWish('world', name);
    const kn = koName(name);
    const crowned = tripCount('world', name) >= 2;
    const show = st || wish || crowned || (z>=5) || (z>=2.5 && MAJOR.has(kn)) ;
    if(!show) return;
    let txt = '';
    if(crowned) txt += '<span class="cr">👑</span> ';
    txt += kn;
    if(st==='solo') txt += `<br><span style="color:#8A6B6B">${unitNames('world', name)}</span>`;
    L.marker(center, {icon: L.divIcon({className:'name-label'+(crowned?' crown':''), html: txt, iconSize:null}), interactive:false}).addTo(labelGroup);
  });
}
/* 한국 지역명 라벨: 확대하면 전 지역, 축소 상태에선 색칠/위시 지역만 */
function renderKoreaUnitLabels(){
  unitLabelGroup.clearLayers();
  if(curTab!=='korea' || !koreaGeoData) return;
  const showAll = map.getZoom() >= 9;
  Object.keys(KR_CENTER).forEach(unit=>{
    const st = unitStatus('korea', unit);
    const wish = isWish('korea', unit);
    if(!showAll && !st && !wish) return;
    const crowned = tripCount('korea', unit) >= 2;
    let txt = '';
    if(crowned) txt += '<span class="cr">👑</span> ';
    txt += unit;
    if(st==='solo') txt += `<br><span style="color:#8A6B6B">${unitNames('korea', unit)}</span>`;
    const mk = L.marker(KR_CENTER[unit], {
      icon: L.divIcon({className:'name-label clickable'+(crowned?' crown':''), html: txt, iconSize:null}),
      interactive:true
    });
    mk.on('click', ()=>{ highlight('korea', unit); openDetail('korea', unit); });
    mk.addTo(unitLabelGroup);
  });
}

/* 통계 칩 클릭 → 해당 목록 시트 */
function openStatList(kind){
  let title='', items=[];  // items: {scope, name, sub, tagText, tagColor}
  const w = state.records.filter(r=>r.scope==='world');
  if(kind==='both'){
    title='💕 같이 간 나라';
    [...new Set(w.filter(r=>r.who==='both').map(r=>r.country))].sort().forEach(c=>{
      const cs=[...new Set(w.filter(r=>r.country===c&&r.who==='both').map(r=>r.city))];
      items.push({scope:'world', name:c, sub:cs.join(', '), tagText:'같이', tagColor:'var(--both)'});
    });
  } else if(kind==='countries'){
    title='🌍 방문한 나라';
    [...new Set(w.map(r=>r.country))].sort().forEach(c=>{
      const recs=recsFor('world',c);
      const both=recs.some(r=>r.who==='both');
      const cs=[...new Set(recs.map(r=>r.city))];
      items.push({scope:'world', name:c, sub:cs.join(', '),

    state.wishes.filter(x=>x.scope==='world').forEach(wi=>{
      items.push({scope:'world', name:wi.name,

      const recs=recsFor('korea',c);

      items.push({scope:'korea', name:c, sub:'',
        tagText: both?'같이':unitNames('korea',c), tagColor: both?'var(--both)':'var(--me)'});
    });
  } else if(kind==='korea-both'){
    title='💕 같이 간 국내';
    [...new Set(state.records.filter(r=>r.scope==='korea'&&r.who==='both').map(r=>r.city))].sort().forEach(c=>{
      items.push({scope:'korea', name:c, sub:'', tagText:'같이', tagColor:'var(--both)'});
    });
  } else if(kind==='korea-wish'){
    title='⭐ 국내 위시리스트';
    state.wishes.filter(x=>x.scope==='korea').forEach(wi=>{
      items.push({scope:'korea', name:wi.name,
        sub: wi.planDate?('✈️ '+wi.planDate+' 예정'):'', tagText: wi.planDate?ddayText(wi.planDate):'위시',

  }
  let html = `<h2>${title} <span style="color:var(--sub);font-size:15px">${items.length}</span></h2>`;
  if(!items.length){ html += `<p class="hint" style="margin-top:10px">아직 없어요.</p>`; }

      <div class="r1"><span class="city">${it.scope==='world'&&!/^🇰🇷/.test(it.name)?koName(it.name):it.name}</span>
        <span class="who" style="background:${it.tagColor}">${it.tagText}</span></div>

/* ── 상세 시트 ── */
let curDetail = null;
function openDetail(scope, name){
  curDetail = {scope, name};
  const recs = recsFor(scope, name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const st = unitStatus(scope, name);
  const wishObj = getWish(scope, name);
  const badge = st==='both' ? '<span class="badge both">같이 다녀옴 💕</span>'
              : st==='solo' ? `<span class="badge me">${unitNames(scope,name)} 다녀옴</span>`
              : wishObj ? '<span class="badge wish">가고 싶은 곳 ⭐</span>'
              : '<span class="badge none">아직 안 가봄</span>';
  const crown = tripCount(scope,name)>=2 ? ' 👑' : '';
  let html = `<h2>${name}${crown} ${badge}</h2>`;

  // 여행 계획(D-day) 표시
  if(wishObj && wishObj.planDate){
    const dd = ddayText(wishObj.planDate);
    html += `<div class="plan-card">
      <div class="pc1">✈️ 여행 계획 <b>${dd}</b></div>
      <div class="pc2">${wishObj.planDate} 예정</div>
      <div class="actions"><button onclick="editPlan()">일정 수정</button><button onclick="removePlan()">일정 취소</button></div>
    </div>`;
  }

  if(!recs.length) html += `<p class="hint" style="margin-top:8px">아직 기록이 없어요. ${scope==='world'?'다녀온 도시를 추가해보세요!':'다녀왔다면 기록을 남겨보세요!'}</p>`;
  recs.forEach(r=>{
    const whoTxt = r.who==='both' ? '같이 💕' : (r.who==='me' ? CONFIG.NAME_ME : CONFIG.NAME_PARTNER);
    const whoBg = r.who==='both' ? 'var(--both)' : (r.who==='me' ? 'var(--me)' : 'var(--pt)');
    html += `<div class="rec">
      <div class="r1"><span class="city">📍 ${r.city}</span><span class="who" style="background:${whoBg}">${whoTxt}</span></div>
      <div class="meta">${r.date ? r.date.replace('-','년 ')+'월' : ''} ${r.rating ? ' · ' + '⭐'.repeat(r.rating) : ''}</div>
      ${r.memo ? `<div class="memo">${esc(r.memo)}</div>` : ''}
      ${r.link ? `<div style="margin-top:5px"><a href="${esc(r.link)}" target="_blank">📷 사진 보러가기</a></div>` : ''}
      <div class="actions"><button onclick="editRecord('${r.id}')">수정</button><button onclick="deleteRecord('${r.id}')">삭제</button></div>
    </div>`;
  });

  // 버튼: 위시 담기 / 여행계획 / 기록추가
  html += `<div class="btnrow">
    <button class="btn gold" onclick="toggleWish()">${wishObj ? '⭐ 위시 해제' : '⭐ 가고 싶어요'}</button>
    <button class="btn primary" onclick="openForm()">✏️ 기록 추가</button>
  </div>`;
  if(wishObj && !wishObj.planDate){
    html += `<div class="btnrow"><button class="btn blue" onclick="editPlan()">✈️ 여행 일정 잡기 (D-day 설정)</button></div>`;
  }
  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('sheetbg').classList.add('show');
  document.getElementById('detailSheet').classList.add('show');
}
function getWish(scope, name){ return state.wishes.find(w=>w.scope===scope && w.name===name); }
function toggleWish(){
  const {scope, name} = curDetail;
  const i = state.wishes.findIndex(w=>w.scope===scope && w.name===name);
  if(i>=0){ state.wishes.splice(i,1); toast('위시리스트에서 뺐어요'); }
  else { state.wishes.push({id: uid(), scope, name}); toast('위시리스트에 담았어요 ⭐'); }
  persist(); renderAll(); renderDday(); openDetail(scope, name);
}
function editPlan(){
  const {scope, name} = curDetail;
  let w = getWish(scope, name);
  if(!w){ w = {id: uid(), scope, name}; state.wishes.push(w); }
  const cur = w.planDate || '';
  const v = prompt(`${name} 여행 날짜를 입력하세요 (예: 2026-05-03)`, cur);
  if(v === null) return;
  const t = v.trim();
  if(t && !/^\d{4}-\d{2}-\d{2}$/.test(t)){ toast('YYYY-MM-DD 형식으로 입력해주세요'); return; }
  w.planDate = t || null;
  persist(); renderAll(); renderDday();
  toast(t ? '여행 일정을 잡았어요! ✈️' : '일정을 비웠어요');
  openDetail(scope, name);
}
function removePlan(){
  const w = getWish(curDetail.scope, curDetail.name);
  if(w){ w.planDate = null; persist(); renderAll(); renderDday(); openDetail(curDetail.scope, curDetail.name); toast('여행 일정을 취소했어요'); }
}
function ddayText(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  const diff = Math.round((target - today)/86400000);
  if(diff > 0) return 'D-'+diff;
  if(diff === 0) return 'D-DAY';
  return 'D+'+(-diff);
}

/* ── 기록 폼 ── */
function openForm(){
  editing = null;
  formCtx = {...curDetail};
  document.getElementById('formTitle').textContent = `${formCtx.name} 기록 추가`;
  document.getElementById('cityField').style.display = formCtx.scope==='world' ? 'block' : 'none';
  resetForm();
  document.getElementById('detailSheet').classList.remove('show');
  document.getElementById('formSheet').classList.add('show');
}
function editRecord(id){
  const r = state.records.find(x=>x.id===id);
  if(!r) return;
  editing = id;
  formCtx = {scope: r.scope, country: r.country};
  document.getElementById('formTitle').textContent = `${r.city} 기록 수정`;
  resetForm();
  // 세계 기록은 도시 필드 표시 (좌표 수정 가능)
  document.getElementById('cityField').style.display = r.scope==='world' ? 'block' : 'none';
  if(r.scope==='world'){
    document.getElementById('f-city').value = r.city||'';
    // 기존 좌표가 있으면 유지 (찾기 안 눌러도 저장되게), 없으면 찾기 필요
    if(r.lat && r.lng){
      geoPick = {lat:r.lat, lng:r.lng};
      const box=document.getElementById('geoResult');
      box.style.display='block';
      box.innerHTML = `✅ 저장된 위치 있음 (도시명 바꾸면 [찾기] 다시 눌러주세요)`;
    }
  }
  setWho(r.who); setStar(r.rating||0);
  document.getElementById('f-date').value = r.date||'';
  document.getElementById('f-memo').value = r.memo||'';
  document.getElementById('f-link').value = r.link||'';
  document.getElementById('detailSheet').classList.remove('show');
  document.getElementById('formSheet').classList.add('show');
}
function resetForm(){
  geoPick = null; pickedWho = null; pickedStar = 0;
  ['f-city','f-date','f-memo','f-link'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('geoResult').style.display='none';
  document.querySelectorAll('#whoChips .chip').forEach(c=>c.classList.remove('on'));
  document.querySelectorAll('#starRow span').forEach(s=>s.classList.remove('on'));
}
function setWho(w){
  pickedWho = w;
  document.querySelectorAll('#whoChips .chip').forEach(c=>c.classList.toggle('on', c.dataset.who===w));
}
function setStar(n){
  pickedStar = n;
  document.querySelectorAll('#starRow span').forEach((s,i)=>s.classList.toggle('on', i<n));
}
async function geocodeCity(){
  const q = document.getElementById('f-city').value.trim();
  if(!q){ toast('도시 이름을 입력해주세요'); return; }
  const box = document.getElementById('geoResult');
  box.style.display='block'; box.innerHTML = '<span class="spin">↻</span> 위치를 찾는 중…';
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q=${encodeURIComponent(q + ', ' + formCtx.name)}`;
    let res = await (await fetch(url)).json();
    if(!res.length){
      res = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q=${encodeURIComponent(q)}`)).json();
    }
    if(!res.length){ box.innerHTML = '못 찾았어요 🥲 영문으로 시도해보세요'; geoPick=null; return; }
    geoPick = {lat: +res[0].lat, lng: +res[0].lon};
    box.innerHTML = `✅ 찾았어요: <b>${esc(res[0].display_name.split(',').slice(0,2).join(','))}</b>`;
  }catch(e){ box.innerHTML='검색 오류 — 잠시 후 다시 시도해주세요'; geoPick=null; }
}
async function saveRecord(){
  if(!pickedWho){ toast('누가 다녀왔는지 골라주세요!'); return; }
  if(editing){
    const r = state.records.find(x=>x.id===editing);
    // 세계 기록이면 도시명/좌표도 갱신 (찾기 필수)
    if(r.scope==='world'){
      const city = document.getElementById('f-city').value.trim();
      if(!city){ toast('도시 이름을 입력해주세요!'); return; }
      if(!geoPick){ toast('[찾기]를 눌러 도시 위치를 확인해주세요 📍'); return; }
      r.city = city; r.lat = geoPick.lat; r.lng = geoPick.lng;
    }
    r.who = pickedWho; r.rating = pickedStar;
    r.date = document.getElementById('f-date').value;
    r.memo = document.getElementById('f-memo').value.trim();
    r.link = document.getElementById('f-link').value.trim();
  } else {
    let city, lat=null, lng=null;
    if(formCtx.scope==='world'){
      city = document.getElementById('f-city').value.trim();
      if(!city){ toast('도시 이름을 입력해주세요!'); return; }
      if(!geoPick){ toast('[찾기]를 눌러 도시 위치를 먼저 확인해주세요 📍'); return; }
      lat=geoPick.lat; lng=geoPick.lng;
    } else {
      city = formCtx.name;
    }
    state.records.push({
      id: uid(), scope: formCtx.scope,
      country: formCtx.scope==='world' ? formCtx.name : '대한민국',
      city, lat, lng, who: pickedWho, rating: pickedStar,
      date: document.getElementById('f-date').value,
      memo: document.getElementById('f-memo').value.trim(),
      link: document.getElementById('f-link').value.trim()
    });
  }
  persist(); renderAll(); closeSheets();
  toast(editing ? '수정했어요 ✏️' : '기록했어요! 지도가 칠해졌어요 🎨');
  editing = null;
}
function deleteRecord(id){
  if(!confirm('이 기록을 지울까요?')) return;
  state.records = state.records.filter(r=>r.id!==id);
  persist(); renderAll();
  openDetail(curDetail.scope, curDetail.name);
  toast('지웠어요');
}

/* ── 전체 기록 리스트 ── */
function openList(){
  const body = document.getElementById('listBody');
  const recs = [...state.records].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!recs.length){
    body.innerHTML = '<p class="hint" style="margin-top:30px;text-align:center">아직 기록이 없어요.<br>지도에서 나라를 눌러 첫 여행을 기록해보세요! 🗺️</p>';
  } else {
    let html = '', lastYear = '';
    recs.forEach(r=>{
      const y = r.date ? r.date.slice(0,4)+'년' : '날짜 미입력';
      if(y !== lastYear){ html += `<div class="yearhead">${y}</div>`; lastYear = y; }
      const whoTxt = r.who==='both' ? '같이 💕' : (r.who==='me' ? CONFIG.NAME_ME : CONFIG.NAME_PARTNER);
      const whoBg = r.who==='both' ? 'var(--blue)' : 'var(--red)';
      const place = r.scope==='world' ? `${r.country} · ${r.city}` : `🇰🇷 ${r.city}`;
      html += `<div class="rec">
        <div class="r1"><span class="city">${place}</span><span class="who" style="background:${whoBg}">${whoTxt}</span></div>
        <div class="meta">${r.date ? r.date.replace('-','.')+' · ' : ''}${r.rating?'⭐'.repeat(r.rating):''}</div>
        ${r.memo?`<div class="memo">${esc(r.memo)}</div>`:''}
      </div>`;
    });
    // 위시리스트 섹션
    if(state.wishes.length){
      html += `<div class="yearhead" style="color:#B8860B">⭐ 가고 싶은 곳</div>`;
      state.wishes.forEach(w=>{
        html += `<div class="rec"><div class="r1"><span class="city">${w.scope==='korea'?'🇰🇷 ':''}${w.name}</span></div></div>`;
      });
    }
    body.innerHTML = html;
  }
  document.getElementById('listview').classList.add('show');
}
function closeList(){ document.getElementById('listview').classList.remove('show'); }

/* ── 공통 ── */
function closeSheets(){
  document.getElementById('searchList').classList.remove('show');
  document.getElementById('sheetbg').classList.remove('show');
  document.getElementById('detailSheet').classList.remove('show');
  document.getElementById('formSheet').classList.remove('show');
  if(selName){
    const prev = selName; selName = null;
    const lay = curTab==='world' ? worldLayer : koreaLayer;
    if(lay) lay.eachLayer(l=>{
      const n = curTab==='world' ? l.feature.properties.name : l.feature.properties.unit;
      if(n === prev) l.setStyle(styleFor(curTab, n));
    });
  }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* 입장 시마다 PIN 필수 — 자동 입장 없음 */
</script>
