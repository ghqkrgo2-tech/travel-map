<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>우리 여행 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* ═══════════ 디자인 시스템 (CLAUDE.md 5번) ═══════════ */
:root{
  --me:#B06B6B;   --me-soft:#D9BFBF;      /* 윤호 = 회색빛 레드 🧑 */
  --pt:#6B84B0;   --pt-soft:#BFCADB;      /* 가진 = 회색빛 블루 👩 */
  --both:#5FAE7E; --both-soft:#BFE0CD;    /* 같이 = 초록 💕 */
  --wish:#EBD98A; --wish-line:#CBB85C;    /* 위시 = 옅은 노랑 ⭐ */
  --mix:#8A7B9E;                          /* 윤호+가진 각자 = 보라 */
  --gold:#CBB85C;
  --bg:#FFF9F2; --card:#FFFFFF;
  --text:#5C4948; --sub:#B0A09E; --line:#F0E5DC;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Gowun Dodum',sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pt-soft)}
small{color:var(--sub)}

/* ── PIN 잠금 ── */
#lock{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#lock .logo{font-size:44px}
#lock h1{font-size:26px}
#lock .dots{display:flex;gap:14px;height:16px}
#lock .dot{width:14px;height:14px;border-radius:50%;background:var(--line);transition:background .15s}
#lock .dot.on{background:var(--me)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:8px}
#lock .pad button{height:60px;border-radius:20px;background:var(--card);font-size:22px;font-family:'Jua';box-shadow:0 2px 8px rgba(92,73,72,.07)}
#lock .pad button:active{background:var(--line)}
#lock .msg{color:var(--me);font-size:13px;height:16px}

/* ── 셸: 헤더 / 화면 / 탭바 ── */
#app{display:none;flex-direction:column;height:100%}
header{padding:14px 16px 8px;flex-shrink:0}
header .top{display:flex;align-items:center;justify-content:space-between}
header h1{font-size:22px}
#syncdot{font-size:11px;color:var(--sub)}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 화면 컨테이너: 한 번에 하나만 표시 */
#screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:4px 0}
.screen.on{display:flex}
.placeholder{margin:auto;text-align:center;font-family:'Jua';font-size:22px;color:var(--text);line-height:1.7;padding:40px}
.placeholder small{display:block;font-family:'Gowun Dodum';font-size:13px;margin-top:6px}

/* ═══════════ 🏠 홈 대시보드 ═══════════ */
.home{padding:4px 14px 24px}
.home-hero{background:linear-gradient(135deg,#F7E5E2,#E9F3F8);border-radius:20px;padding:19px 20px;margin:2px 0 16px;box-shadow:0 2px 9px rgba(92,73,72,.06)}
.home-hero p{font-size:12px;color:var(--sub);margin-bottom:5px}
.home-hero h2{font-size:22px;line-height:1.35}
.home-section{margin:0 0 18px}
.home-section-head{display:flex;align-items:center;justify-content:space-between;margin:0 3px 8px}
.home-section-head h3{font-size:16px}
.home-section-head button{font-size:12px;color:var(--sub)}
.home-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.home-stats>div{min-width:0;background:var(--card);border-radius:14px;padding:11px 5px 9px;text-align:center;box-shadow:0 1px 5px rgba(92,73,72,.06)}
.home-stats b{display:block;font-family:'Jua';font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-stats span{display:block;color:var(--sub);font-size:10.5px;margin-top:3px}
.home-trip{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:0 1px 6px rgba(92,73,72,.06)}
.home-trip:active{opacity:.86}
.home-trip-icon{font-size:23px;flex-shrink:0}
.home-trip-copy{min-width:0;flex:1}
.home-trip-copy b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-trip-copy small{display:block;font-size:11.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-trip-label{flex-shrink:0;background:var(--both);color:#fff;border-radius:10px;padding:4px 8px;font-family:'Jua';font-size:12px}
.home-trip-label.muted{background:var(--sub)}
.home-empty{background:var(--card);border-radius:16px;padding:18px;text-align:center;color:var(--sub);font-size:13px;line-height:1.65;box-shadow:0 1px 6px rgba(92,73,72,.06)}
.home-empty button{margin-top:7px;color:var(--me);font-family:'Jua';font-size:14px}
.home-shortcut-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.home-shortcut-grid button{background:var(--card);border-radius:14px;padding:12px 4px 10px;font-size:11.5px;box-shadow:0 1px 5px rgba(92,73,72,.06)}
.home-shortcut-grid span{display:block;font-size:22px;margin-bottom:4px}

/* ═══════════ ⭐ 위시 ═══════════ */
.wish-summary{display:flex;gap:7px;align-items:stretch;min-height:43px;margin:4px 14px 10px;overflow-x:auto}
.wish-summary::-webkit-scrollbar{display:none}
.wish-summary span{flex:1;min-width:88px;display:flex;align-items:center;justify-content:center;background:#FFF7DF;border:1px solid #F0DE9D;border-radius:12px;padding:7px 9px;font-size:11.5px;color:var(--sub);white-space:nowrap;text-align:center}
.wish-summary b{font-family:'Jua';font-size:15px;color:#A98728;margin-left:2px}
.wish-list{padding:0 14px 22px}
.wish-card{background:var(--card);border-radius:17px;padding:13px 14px;margin:9px 0;box-shadow:0 1px 6px rgba(92,73,72,.06)}
.wish-card-main{display:flex;align-items:center;gap:10px}
.wish-place-icon{font-size:24px;flex-shrink:0}
.wish-copy{min-width:0;flex:1}
.wish-copy h3{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wish-copy p{font-size:11.5px;color:var(--sub);margin-top:5px;display:flex;align-items:center;gap:5px;min-width:0}
.wish-date{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wish-date.muted{color:var(--sub)}
.wish-card-actions{display:flex;gap:7px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
.wish-card-actions button{padding:5px 7px;border-radius:9px;background:var(--bg);font-size:11.5px;color:var(--sub)}
.wish-card-actions .promote{margin-left:auto;background:#FDF3DC;color:#A98728;font-family:'Jua'}
.wish-card-actions .delete{font-size:17px;line-height:1;padding:2px 6px;color:var(--sub)}

/* ═══════════ 📝 여행 후기 ═══════════ */
.review-wrap{padding:4px 14px 24px}
.review-hero{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#F7E9E7,#F4F0E5);border-radius:18px;padding:15px 16px;margin:4px 0 12px}
.review-hero.done{background:linear-gradient(135deg,#E7F5EC,#F2F8F0)}
.review-hero>span{font-size:29px}.review-hero h3{font-size:17px}.review-hero p{font-size:12px;color:var(--sub);margin-top:3px}
.review-links{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
.review-link{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:13px;padding:11px 13px;box-shadow:0 1px 5px rgba(92,73,72,.06);font-size:13px;color:var(--text);text-decoration:none}
.review-link span{font-size:11.5px;color:var(--pt)}
.review-form{background:var(--card);border-radius:17px;padding:3px 14px 15px;box-shadow:0 1px 6px rgba(92,73,72,.06)}
.review-form textarea{resize:vertical;line-height:1.55}
.review-stars{display:flex;gap:7px;font-size:27px}.review-stars button{filter:grayscale(1);opacity:.35;line-height:1}.review-stars button.on{filter:none;opacity:1}
.review-done{display:flex!important;align-items:center;gap:8px;margin-top:18px!important;color:var(--text)!important;cursor:pointer}.review-done input{width:20px;height:20px;accent-color:var(--both)}

/* 지도 화면 */
#screen-map{padding:0}
#mapTop{flex-shrink:0;padding:8px 12px 4px}
#mapToggle{display:flex;gap:8px}
#mapToggle button{flex:1;padding:9px 0;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-family:'Jua'}
#mapToggle button.on{background:var(--me);border-color:var(--me);color:#fff}
#mapToggle #mapSearchBtn{flex:0 0 44px;font-family:inherit;font-size:16px}
#mapToggle #mapSearchBtn.on{background:var(--me);border-color:var(--me);color:#fff}
#mapSearchbar{display:none;position:relative;margin-top:8px}
#mapSearchbar.show{display:block}
#mapSearchInput{font-size:14px;padding:9px 12px}
#mapSearchList{position:absolute;left:0;right:0;top:45px;z-index:700;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(92,73,72,.18);max-height:260px;overflow-y:auto;display:none}
#mapSearchList.show{display:block}
#mapSearchList .si{width:100%;padding:11px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;text-align:left}
#mapSearchList .si:last-child{border-bottom:none}#mapSearchList .si:active{background:var(--bg)}
#mapSearchList .tag{margin-left:auto;font-size:10.5px;color:#fff;border-radius:8px;padding:2px 7px;white-space:nowrap}
#mapSearchList .none{padding:14px;text-align:center;color:var(--sub);font-size:13px}
#stats{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
#stats::-webkit-scrollbar{display:none}
.stat{flex-shrink:0;background:var(--card);cursor:pointer;border-radius:14px;padding:7px 12px;font-size:12.5px;box-shadow:0 1px 5px rgba(92,73,72,.06);white-space:nowrap}
.stat b{font-family:'Jua';font-size:14px}
.stat.rank{background:linear-gradient(135deg,#FFF3D4,#FFE9B8);font-family:'Jua'}
#mapwrap{flex:1;position:relative;z-index:0;border-radius:20px 20px 0 0;overflow:hidden;margin:6px 8px 0;box-shadow:0 -2px 12px rgba(92,73,72,.05)}
#map{position:absolute;inset:0;background:#EAF4FA}
#legend{position:absolute;left:10px;bottom:12px;z-index:500;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 11px;box-shadow:0 2px 8px rgba(92,73,72,.15);font-size:12px;display:flex;flex-direction:column;gap:5px}
#legend .lg{display:flex;align-items:center;gap:7px;color:var(--text)}
#legend .sw{width:13px;height:13px;border-radius:4px;flex-shrink:0}
.leaflet-container{font-family:'Gowun Dodum'}
.name-label{background:rgba(255,255,255,.92);border:none;border-radius:9px;padding:2px 9px;font-size:12.5px;color:var(--text);box-shadow:0 2px 6px rgba(92,73,72,.18);white-space:nowrap;font-family:'Jua';font-weight:400;text-align:center;line-height:1.25}
.name-label:before{display:none}
.name-label.clickable{cursor:pointer}
.name-label.crown{font-size:14.5px;padding:3px 11px;background:linear-gradient(135deg,#FFF7E0,#FFEFC2);border:1.5px solid var(--wish-line);box-shadow:0 2px 8px rgba(203,184,92,.35)}
.city-marker{display:flex;flex-direction:column;align-items:center}
.city-dot{width:9px;height:9px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.city-name{margin-top:2px;background:rgba(255,255,255,.82);border-radius:10px;padding:0 6px;font-size:9.5px;color:var(--sub);white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.1);font-family:'Gowun Dodum';border:.5px solid var(--line)}

/* 도시 서브탭 (여행 상세 안) */
.city-item{background:var(--card);border-radius:14px;padding:11px 14px;margin:8px 14px;box-shadow:0 1px 5px rgba(92,73,72,.06)}
.city-item .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.city-item .cname{font-family:'Jua';font-size:15px}
.city-item .cmeta{font-size:12px;color:var(--sub);margin-top:3px}
.city-item .cactions{display:flex;gap:12px;margin-top:6px}
.city-item .cactions button{font-size:12px;color:var(--sub)}
.geo-result{background:#F3F8FF;border:1.5px solid var(--pt-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px;display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:14px}
.chip.on.me{background:var(--me);border-color:var(--me);color:#fff}
.chip.on.pt{background:var(--pt);border-color:var(--pt);color:#fff}
.chip.on.both{background:var(--both);border-color:var(--both);color:#fff}
.stars{display:flex;gap:6px;font-size:26px}
.stars span{filter:grayscale(1);opacity:.4;cursor:pointer}
.stars span.on{filter:none;opacity:1}
.rec{background:var(--card);border-radius:16px;padding:12px 14px;margin-top:10px;box-shadow:0 1px 6px rgba(92,73,72,.06)}
.rec .r1{display:flex;align-items:center;justify-content:space-between}
.rec .city{font-family:'Jua';font-size:16px}
.rec .who{font-size:11.5px;color:#fff;border-radius:9px;padding:2px 8px}
.rec .meta{font-size:12.5px;color:var(--sub);margin-top:3px}
.summary-line{margin-top:10px;font-size:14px}
.summary-line b{font-family:'Jua';color:var(--me)}
.rank-sec{margin-top:14px}.rank-h{font-family:'Jua';font-size:15px;margin-bottom:6px}
.rank-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:12px;margin-bottom:6px;cursor:pointer}
.rank-row .rk{font-size:18px;width:24px;text-align:center}.rank-row .rn{flex:1;font-size:14px}.rank-row .rc{font-family:'Jua';color:var(--me);font-size:14px}

/* ═══════════ 💰 가계부 ═══════════ */
.settle-card{background:linear-gradient(135deg,#EAF6EF,#F3FBF6);border:1.5px solid var(--both-soft);border-radius:18px;padding:16px;margin:10px 14px}
.settle-card .total{font-size:13px;color:var(--sub)}
.settle-card .total b{font-family:'Jua';font-size:22px;color:var(--text)}
.settle-card .paidrow{display:flex;gap:8px;margin-top:10px}
.settle-card .paid{flex:1;background:#fff;border-radius:12px;padding:8px 10px;text-align:center;font-size:12px;color:var(--sub)}
.settle-card .paid b{display:block;font-family:'Jua';font-size:15px;color:var(--text);margin-top:2px}
.settle-result{margin-top:12px;background:#fff;border-radius:14px;padding:12px 14px;text-align:center;font-family:'Jua';font-size:16px;color:var(--text);line-height:1.5}
.settle-result .amt{color:var(--me);font-size:19px}
.settle-result.done{color:var(--both)}
.exp-item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 14px;margin:8px 14px;box-shadow:0 1px 5px rgba(92,73,72,.06)}
.exp-item .cat{font-size:20px;flex-shrink:0}
.exp-item .mid{flex:1;min-width:0}
.exp-item .et{font-size:14.5px}
.exp-item .em{font-size:11.5px;color:var(--sub);margin-top:2px}
.exp-item .amt{font-family:'Jua';font-size:15px;text-align:right;flex-shrink:0}
.exp-item .pay{font-size:10px;color:#fff;border-radius:8px;padding:2px 7px;margin-top:3px;display:inline-block}
.daygroup{font-family:'Jua';font-size:13.5px;color:var(--sub);margin:14px 18px 2px}

/* ═══════════ 📅 일정 타임라인 ═══════════ */
.dayscroll{display:flex;gap:7px;overflow-x:auto;padding:8px 14px 4px}
.dayscroll::-webkit-scrollbar{display:none}
.daychip{flex:0 0 auto;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 12px;font-size:12px;color:var(--sub);line-height:1.3}
.daychip b{display:block;font-family:'Jua';font-size:14px;color:var(--text)}
.daychip.on{background:var(--me);border-color:var(--me);color:#fff}
.daychip.on b{color:#fff}
.tl{position:relative;margin:8px 20px 0;padding-left:20px;border-left:2px solid var(--line)}
.tl-item{position:relative;margin-bottom:14px;cursor:pointer}
.tl-item .dot{position:absolute;left:-27px;top:3px;width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tl-time{font-family:'Jua';font-size:13px;color:var(--me)}
.tl-card{background:var(--card);border-radius:14px;padding:10px 13px;margin-top:3px;box-shadow:0 1px 5px rgba(92,73,72,.06)}
.tl-card .tt{font-size:14.5px}
.tl-card .tm{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.45}
.tl-card .tcat{font-size:11px;color:var(--sub)}

/* ═══════════ 🎒 준비물 ═══════════ */
.pack-prog{margin:10px 14px 0;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 5px rgba(92,73,72,.06)}
.pack-prog .pl{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px}
.pack-prog .pl b{font-family:'Jua';color:var(--both);font-size:15px}
.pack-bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden}
.pack-bar>span{display:block;height:100%;background:var(--both);border-radius:6px;transition:width .3s}
.pack-group{margin:12px 14px 0}
.pack-ghead{display:flex;align-items:center;justify-content:space-between;font-family:'Jua';font-size:15px;margin-bottom:4px}
.pack-ghead .gc{font-size:12px;color:var(--sub);font-family:'Gowun Dodum'}
.pack-item{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:12px;padding:11px 13px;margin-top:7px;box-shadow:0 1px 4px rgba(92,73,72,.05)}
.pack-item .chk{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.pack-item.done .chk{background:var(--both);border-color:var(--both)}
.pack-item.done .pi-name{text-decoration:line-through;color:var(--sub)}
.pack-item .pi-name{flex:1;font-size:14.5px}
.pack-item .pi-who{font-size:10.5px;color:#fff;border-radius:8px;padding:2px 8px;flex-shrink:0}
.pack-item .pi-del{color:var(--sub);font-size:15px;flex-shrink:0}

/* ── 하단 4탭 ── */
nav{display:flex;background:var(--card);border-top:1.5px solid var(--line);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 8px;font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:21px}
nav button.on{color:var(--me)}

/* ── 공용 컴포넌트 ── */
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 14px;box-shadow:0 1px 6px rgba(92,73,72,.06)}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:13px;border-radius:14px;font-family:'Jua';font-size:15px;text-align:center}
.btn.primary{background:var(--me);color:#fff}
.btn.blue{background:var(--pt);color:#fff}
.btn.green{background:var(--both);color:#fff}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
.btn.gold{background:#FDF3DC;color:#B8860B;border:1.5px solid var(--gold)}
.btn:active{opacity:.85}
.badge{font-size:11px;padding:3px 9px;border-radius:10px;color:#fff;font-family:'Gowun Dodum'}
.badge.me{background:var(--me)} .badge.pt{background:var(--pt)} .badge.both{background:var(--both)}
.badge.wish{background:var(--wish-line)} .badge.none{background:var(--sub)}

/* 토스트 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--text);color:#fff;padding:10px 18px;border-radius:14px;font-size:13.5px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;max-width:85%;text-align:center}
.toast.show{opacity:1}

/* ═══════════ 바텀시트 (폼) ═══════════ */
.sheet-bg{position:fixed;inset:0;background:rgba(92,73,72,.35);z-index:100;display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:-100%;max-height:86%;background:var(--bg);border-radius:24px 24px 0 0;z-index:101;transition:bottom .25s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{bottom:0}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 4px;flex-shrink:0}
.sheet-close{position:absolute;top:10px;right:14px;font-size:12.5px;color:var(--sub);background:var(--card);border-radius:12px;padding:5px 11px;box-shadow:0 1px 4px rgba(92,73,72,.12)}
.sheet .body{overflow-y:auto;padding:8px 18px 24px}
.sheet h2{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.form label{display:block;font-size:13px;color:var(--sub);margin:14px 0 5px}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.daterow{display:flex;gap:10px;align-items:center}
.daterow input{flex:1}

/* 나라 다중 선택 (검색 + 칩) */
.picker{position:relative}
.picklist{position:absolute;left:0;right:0;top:46px;z-index:120;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(92,73,72,.18);max-height:230px;overflow-y:auto;display:none}
.picklist.show{display:block}
.picklist .pi{padding:11px 14px;font-size:14px;border-bottom:1px solid var(--line);cursor:pointer}
.picklist .pi:last-child{border-bottom:none}
.picklist .pi:active{background:var(--bg)}
.picklist .none{padding:14px;text-align:center;color:var(--sub);font-size:13px}
.selchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.selchip{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--pt-soft);border-radius:12px;padding:7px 10px;font-size:13.5px}
.selchip button{color:var(--sub);font-size:15px;line-height:1}

/* ═══════════ 여행 탭 ═══════════ */
.screen-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px}
.screen-head h2{font-size:18px}
.trip-card{background:var(--card);border-radius:18px;padding:14px 16px;margin:10px 14px;box-shadow:0 1px 6px rgba(92,73,72,.07);cursor:pointer;position:relative}
.trip-card:active{opacity:.9}
.trip-card .tname{font-family:'Jua';font-size:17px}
.trip-card .tmeta{font-size:12.5px;color:var(--sub);margin-top:4px}
.trip-card .tflags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.trip-card .dday{position:absolute;top:14px;right:16px;background:var(--both);color:#fff;border-radius:12px;padding:4px 10px;font-family:'Jua';font-size:13px}
.trip-card .dday.done{background:var(--sub)}
.mini{font-size:11.5px;color:var(--sub);background:var(--bg);border-radius:9px;padding:3px 9px}
.empty-state{margin:auto;text-align:center;color:var(--sub);font-size:14px;line-height:1.7;padding:50px 30px}
.empty-state .big{font-size:40px;display:block;margin-bottom:10px}
.fab-row{padding:6px 14px 16px}

/* 여행 상세 (전체화면 오버레이) */
#tripDetail{position:fixed;inset:0;background:var(--bg);z-index:80;display:none;flex-direction:column}
#tripDetail.show{display:flex}
#tripDetail .dhead{padding:16px 16px 6px;flex-shrink:0}
#tripDetail .dhead .drow{display:flex;align-items:center;justify-content:space-between;gap:10px}
#tripDetail .dhead h2{font-size:20px}
#tripDetail .dhead .dmeta{font-size:12.5px;color:var(--sub);margin-top:4px}
#tripDetail .backbtn{font-size:15px;color:var(--text);flex-shrink:0}
.subtabs{display:flex;gap:6px;padding:8px 14px 4px;flex-shrink:0;overflow-x:auto}
.subtabs button{flex:0 0 auto;padding:8px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:13.5px}
.subtabs button.on{background:var(--me);border-color:var(--me);color:#fff;font-family:'Jua'}
#subBody{flex:1;overflow-y:auto;padding:6px 0 30px}

/* ═══════════ 보완 (디자인 마감) ═══════════ */
/* 여정 안내 링크 (여행↔위시 연결) */
.linklike{margin-top:12px;color:var(--me);font-family:'Jua';font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

/* 지도 상세 시트 = 지도 위에 뜨는 플로팅 카드 (비모달) */
#mapSheet{left:8px;right:8px;max-width:600px;margin:0 auto;border-radius:20px;max-height:60%;background:rgba(255,249,242,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(92,73,72,.28)}
#mapSheet.show{bottom:12px}

/* 색 대비: 위시 노랑 계열 가독성 */
.badge.wish{background:#A9852B;color:#fff}
.wish-card-actions .promote{background:#F7E6B8;color:#7E610F}
.stat.rank{color:#7E610F}

/* 마이크로 인터랙션 */
/* 지도 컨테이너 상위에 transform이 걸리면 Leaflet 좌표가 틀어지므로 opacity만 사용 */
@keyframes screenIn{from{opacity:0}to{opacity:1}}
.screen.on{animation:screenIn .2s ease}
#screen-map.on{animation:none}   /* 지도 탭은 애니메이션 제외(안전) */
.btn:active,.stat:active,.daychip:active,.chip:active{transform:scale(.97)}
.pack-item .chk{transition:transform .14s ease,background .14s ease,border-color .14s ease}
.pack-item.done .chk{animation:chkPop .24s ease}
@keyframes chkPop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* 빈 화면 톤 통일 보강 */
.empty-state .fab-row{margin-top:4px}
.empty-state .fab-row .btn{max-width:220px;margin:0 auto}

/* 여행 탭 세계/한국 토글 */
#tripToggle{display:flex;gap:8px;padding:2px 14px 4px}
#tripToggle button{flex:1;padding:9px 0;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-family:'Jua';color:var(--sub)}
#tripToggle button b{color:var(--text)}
#tripToggle button.on{background:var(--me);border-color:var(--me);color:#fff}
#tripToggle button.on b{color:#fff}
/* 여행 카드 별점 */
.card-stars{font-size:12px;color:var(--gold);letter-spacing:1px;vertical-align:middle}
/* 여행 상세 who 필터바 */
.whofilter{display:flex;gap:6px;padding:2px 14px 4px;flex-shrink:0;overflow-x:auto}
.whofilter .wf{flex:0 0 auto;padding:6px 13px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-size:12.5px;color:var(--sub)}
.whofilter .wf.on{color:#fff;font-family:'Jua'}
.whofilter .wf.on:not(.me):not(.pt):not(.both){background:var(--text);border-color:var(--text)}
.whofilter .wf.me.on{background:var(--me);border-color:var(--me)}
.whofilter .wf.pt.on{background:var(--pt);border-color:var(--pt)}
.whofilter .wf.both.on{background:var(--both);border-color:var(--both)}
/* 홈 각자의 발자국 */
.person-stats{display:flex;gap:8px}
.person-card{flex:1;background:var(--card);border-radius:14px;padding:11px 12px;box-shadow:0 1px 5px rgba(92,73,72,.06);border-left:4px solid var(--line)}
.person-card.me{border-left-color:var(--me)}
.person-card.pt{border-left-color:var(--pt)}
.person-card .ph{font-family:'Jua';font-size:14px;margin-bottom:6px}
.person-card .pnums{display:flex;gap:10px;font-size:11px;color:var(--sub)}
.person-card .pnums b{font-family:'Jua';font-size:15px;color:var(--text)}
/* 후기 읽기 메모 */
.review-read-memo{background:var(--card);border-radius:14px;padding:13px 15px;font-size:14.5px;line-height:1.6;box-shadow:0 1px 5px rgba(92,73,72,.06);white-space:pre-wrap}

<div id="lock">
  <div class="logo">🗺️💕</div>

</div>

<!-- ══════════ 앱 본체 ══════════ -->
<div id="app">
  <header>
    <div class="top">
      <h1 id="title">🏠 우리 여행 지도</h1>
      <span id="syncdot">●</span>
    </div>
  </header>

  <!-- 화면(탭)들: 한 번에 하나만 .on -->

    <section id="screen-home" class="screen on">
      <!-- home.js가 여행 데이터 기반 대시보드를 렌더링 -->

    <section id="screen-map" class="screen">
      <div id="mapTop">
        <div id="mapToggle">
          <button id="mt-world" class="on" onclick="setMapScope('world')">🌍 세계</button>
          <button id="mt-korea" onclick="setMapScope('korea')">🇰🇷 한국</button>
          <button id="mapSearchBtn" aria-label="지도 검색" onclick="toggleMapSearch()">🔍</button>
        </div>
        <div id="mapSearchbar">
          <input id="mapSearchInput" placeholder="🔍 나라 검색 (예: 터키, 일본)" autocomplete="off"
            oninput="onMapSearch(this.value)" onfocus="onMapSearch(this.value)">

        <div id="stats"></div>
      </div>
      <div id="mapwrap">
        <div id="map"></div>
        <div id="legend">
          <div class="lg"><span class="sw" style="background:#B06B6B"></span>🧑 윤호</div>
          <div class="lg"><span class="sw" style="background:#6B84B0"></span>👩 가진</div>

        </div>
      </div>
    </section>

    <section id="screen-trips" class="screen">
      <div class="placeholder">✈️ 여행<br><small>2단계에서 만들 예정</small></div>
    </section>

    <section id="screen-wish" class="screen">
      <!-- wish.js가 위시 목록을 렌더링 -->
    </section>
  </main>

  <!-- 하단 4탭 -->
  <nav>
    <button id="tab-home" class="on" onclick="switchTab('home')"><span class="ic">🏠</span>홈</button>

  </nav>
</div>

/* 영문 나라명 → 한글명 (없으면 원문) */
const koName = n => (COUNTRY[n] || [n])[0];

/* ── 최상위 상태: 여행 중심 ── */
let state = { trips: [], wishes: [] };

/* 삭제 반영용 id 목록 (병합 시 서버에서 제외). 여행 삭제뿐 아니라
   여행 안의 도시/일정/가계부/준비물 항목 삭제도 여기에 id를 기록한다. */
let deletedIds = JSON.parse(localStorage.getItem('tm2_deleted') || '[]');

/* ── 유틸 ── */
const now = () => Date.now();
function uid(prefix){
  return (prefix || 'x') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
/* 어떤 항목이든 저장할 때 updatedAt 도장 찍기 (동시편집 병합의 근거) */
function stamp(obj){ obj.updatedAt = now(); return obj; }
/* 삭제: 데이터에서 빼고 deletedIds에 기록 */
function markDeleted(id){
  if(id && !deletedIds.includes(id)) deletedIds.push(id);
}

/* 빈 여행 하나 생성 (아직 state에 넣지는 않음) */
function newTrip(){
  return {
    id: uid('t'), name: '', countries: [], startDate: '', endDate: '',
    cities: [], plans: [], budget: [], packing: [],
    review: { blog: '', album: '', memo: '', rating: 0, done: false },
    updatedAt: now()
  };
}
function getTrip(id){ return state.trips.find(t => t.id === id) || null; }

/* ═══════════ 지도 색칠의 원천 ═══════════
   모든 여행의 cities를 모아 방문 나라/도시 집합을 만든다.
   (3단계 map.js가 이 결과로 지도를 칠한다.) */
function deriveVisited(){
  const countries = {};  // country → { who:Set, count(=방문한 여행 수), trips:[] }
  const cities = {};     // "country|city" → { city, country, lat, lng, who:Set, count, trips:[] }
  state.trips.forEach(t => {
    // 한 여행에서 도시를 여러 개 가도 그 나라는 "1회 방문"으로 센다 (여행당 1회)
    const seenCountry = new Set(), seenCity = new Set();
    (t.cities || []).forEach(c => {
      if(!c.country) return;
      const co = countries[c.country] || (countries[c.country] = { who: new Set(), count: 0, trips: [] });
      if(c.who) co.who.add(c.who);
      if(!seenCountry.has(c.country)){ co.count++; co.trips.push(t.id); seenCountry.add(c.country); }
      if(c.city){
        const key = c.country + '|' + c.city;
        const ci = cities[key] || (cities[key] = {
          city: c.city, country: c.country, lat: c.lat, lng: c.lng,
          who: new Set(), count: 0, trips: []
        });
        if(c.who) ci.who.add(c.who);
        if(!ci.lat && c.lat){ ci.lat = c.lat; ci.lng = c.lng; }
        if(!seenCity.has(key)){ ci.count++; ci.trips.push(t.id); seenCity.add(key); }  // 같은 여행 내 중복 도시도 1회
      }
    });
  });
  return { countries, cities };
}

/* ═══════════ 저장소 (시트 또는 로컬) ═══════════ */
function normalize(data){
  // v1(records/wishes) 응답이나 빈 값이 와도 v2 형태로 정규화
  data = data || {};
  return {
    trips: Array.isArray(data.trips) ? data.trips : [],
    wishes: Array.isArray(data.wishes) ? data.wishes : []
  };
}

async function loadData(){
  if(CONFIG.API_URL){
    try{
      setSync('sync');
      const r = await fetch(CONFIG.API_URL, { method:'POST',
        body: JSON.stringify({ action:'load', pin: CONFIG.PIN }) });
      const j = await r.json();
      if(j.ok){ state = normalize(j.data); setSync('ok'); return; }
      throw new Error(j.error || 'load fail');
    }catch(e){ setSync('err'); toast('불러오기 실패 — 저장된 내용으로 표시해요'); }
  }
  const local = localStorage.getItem('tm2_state');
  state = local ? normalize(JSON.parse(local)) : { trips: [], wishes: [] };
  setSync(CONFIG.API_URL ? 'err' : 'local');
}

let saveTimer = null;
function persist(){
  localStorage.setItem('tm2_state', JSON.stringify(state));
  localStorage.setItem('tm2_deleted', JSON.stringify(deletedIds));
  if(!CONFIG.API_URL) return;
  setSync('sync');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      const payload = { action:'save', pin: CONFIG.PIN,
        data: { trips: state.trips, wishes: state.wishes, deletedIds } };
      const r = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify(payload) });
      const j = await r.json();
      if(j.ok && j.data){
        state = normalize(j.data);   // 서버 병합본으로 갱신 (상대방 동시편집 반영)
        deletedIds = [];
        localStorage.setItem('tm2_state', JSON.stringify(state));
        localStorage.setItem('tm2_deleted', '[]');
        if(typeof renderAll === 'function') renderAll();
      }
      setSync(j.ok ? 'ok' : 'err');
    }catch(e){
      setSync('err');
      toast('⚠️ 저장 실패 — 인터넷 확인 후 다시 시도해요');
      setTimeout(() => { if(navigator.onLine) persist(); }, 5000);
    }
  }, 600);
}

function setSync(s){
  const el = document.getElementById('syncdot');
  if(!el) return;
  if(s === 'ok'){ el.textContent = '● 공유중'; el.style.color = '#7BC49A'; }
  else if(s === 'sync'){ el.innerHTML = '<span class="spin">↻</span> 저장중'; el.style.color = 'var(--sub)'; }
  else if(s === 'err'){ el.textContent = '● 오프라인'; el.style.color = 'var(--gold)'; }
  else { el.textContent = '● 내 폰에만 저장'; el.style.color = 'var(--sub)'; }
}

let pinBuf = '';
function pinKey(n){

  else if(pinBuf.length < 4){ pinBuf += n; }
  document.querySelectorAll('#lock .dot').forEach((d, i) => d.classList.toggle('on', i < pinBuf.length));
  if(pinBuf.length === 4){
    if(pinBuf === CONFIG.PIN){ unlock(); }
    else {
      document.getElementById('lockmsg').textContent = '앗, 비밀번호가 달라요 🥲';

        document.querySelectorAll('#lock .dot').forEach(d => d.classList.remove('on'));

function switchTab(t){

  ['home', 'map', 'trips', 'wish'].forEach(k => {

    document.getElementById('screen-' + k).classList.toggle('on', k === t);

function renderAll(){ renderTab(curTab); }

/* ── 부트스트랩 ── */
async function initApp(){

  switchTab('home');
}

/* ── 토스트 ── */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* HTML 이스케이프 (모듈 공용) */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

<script>
/* ═══════════════════════════════════════════════
   trips.js — ✈️ 여행 탭
   여행 목록 / 새 여행 만들기 / 수정 / 삭제
   + 여행 상세(도시·일정·가계부·준비물·후기 서브탭)
   ═══════════════════════════════════════════════ */

let curTripId = null;      // 상세로 열려있는 여행
let editTripId = null;     // 폼에서 수정 중인 여행 (null이면 새 여행)
let formSel = [];          // 폼에서 선택된 나라(영문키) 목록
let tripFormSeed = null;   // 위시 승격 등 새 여행 폼의 사전 입력값
let curSubtab = 'cities';
let tripListScope = 'world';   // 여행 목록 세계/한국 구분
let tripWhoFilter = 'all';     // 여행 상세 who 필터 (all|me|partner|both)

/* 여행이 국내(한국)인지 판별: 나라가 모두 한국 (없으면 도시 나라로 추정) */
function tripIsKorea(t){
  const isK=c=>c==='South Korea'||c==='대한민국'||c==='Korea';
  const cs=t.countries||[];
  if(cs.length) return cs.every(isK);
  const cities=t.cities||[];
  return cities.length ? cities.every(c=>isK(c.country)) : false;
}
/* who 필터 통과 (도시·가계부: me|partner|both) */
function passWho(w){ return tripWhoFilter==='all' || w===tripWhoFilter; }
/* 준비물 who(공용|윤호|가진) 필터 통과 */
function passPackWho(w){
  if(tripWhoFilter==='all') return true;
  const map={me:CONFIG.NAME_ME, partner:CONFIG.NAME_PARTNER, both:'공용'};
  return w===map[tripWhoFilter];
}
function reviewStarsMini(r){ return r?('★'.repeat(r)):''; }

/* ── 날짜 유틸 ── */
function fmtDate(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return `${y}.${m}.${day}`; }
function tripDays(t){
  if(!t.startDate || !t.endDate) return 0;
  const a=new Date(t.startDate), b=new Date(t.endDate);
  return Math.round((b-a)/86400000)+1;
}
function fmtPeriod(t){
  if(!t.startDate) return '날짜 미정';
  let s = fmtDate(t.startDate);
  if(t.endDate && t.endDate!==t.startDate){
    const [ , m, d] = t.endDate.split('-');
    s += ` ~ ${m}.${d}`;
    const days = tripDays(t);
    if(days) s += ` (${days-1}박 ${days}일)`;
  }
  return s;
}
function tripDday(t){
  if(!t.startDate) return { label:'날짜 미정', cls:'done' };
  const today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(t.startDate+'T00:00:00');
  const end=new Date((t.endDate||t.startDate)+'T00:00:00');
  const diff=Math.round((start-today)/86400000);
  if(today>end) return { label:'다녀옴', cls:'done' };
  if(today>=start && today<=end) return { label:'여행중 💕', cls:'' };
  if(diff===0) return { label:'D-DAY', cls:'' };
  return { label:'D-'+diff, cls:'' };
}
/* 목록 정렬: 예정(가까운 순) → 진행중 → 다녀옴(최근 순) */
function sortedTrips(){
  const today=new Date(); today.setHours(0,0,0,0);
  return [...state.trips].sort((a,b)=>{
    const sa=a.startDate||'9999', sb=b.startDate||'9999';
    const pa=new Date((a.endDate||a.startDate||'9999')+'T00:00:00')<today?1:0;
    const pb=new Date((b.endDate||b.startDate||'9999')+'T00:00:00')<today?1:0;
    if(pa!==pb) return pa-pb;                 // 안 지난 여행 먼저
    return pa ? sb.localeCompare(sa)          // 과거: 최근 먼저
             : sa.localeCompare(sb);          // 미래: 임박 먼저
  });
}

/* ═══════════ 목록 화면 ═══════════ */
function renderTrips(){
  ensureTripDom();
  const scr = document.getElementById('screen-trips');
  const all = sortedTrips();
  const trips = all.filter(t=> tripListScope==='korea' ? tripIsKorea(t) : !tripIsKorea(t));
  const worldN=all.filter(t=>!tripIsKorea(t)).length, koreaN=all.filter(t=>tripIsKorea(t)).length;
  let html = `<div class="screen-head"><h2>✈️ 우리의 여행</h2>
    <button class="btn primary" style="flex:0;padding:9px 16px" onclick="openTripForm()">+ 새 여행</button></div>
    <div id="tripToggle">
      <button class="${tripListScope==='world'?'on':''}" onclick="setTripListScope('world')">🌍 세계 <b>${worldN}</b></button>
      <button class="${tripListScope==='korea'?'on':''}" onclick="setTripListScope('korea')">🇰🇷 한국 <b>${koreaN}</b></button>
    </div>`;
  if(!trips.length){
    html += `<div class="empty-state"><span class="big">🧳</span>
      ${tripListScope==='korea'?'국내':'해외'} 여행이 아직 없어요.<br>새 여행을 만들어볼까요?
      <div class="fab-row"><button class="btn primary" onclick="openTripForm()">새 여행 만들기</button></div>
      ${state.wishes.length?`<button class="linklike" onclick="switchTab('wish')">⭐ 위시에 담아둔 곳에서 만들기</button>`:''}
    </div>`;
  } else {
    html += trips.map(t=>{
      const dd=tripDday(t);
      const flags=(t.countries||[]).map(c=>`<span class="mini">${esc(koName(c))}</span>`).join('');
      const counts=[];
      if((t.cities||[]).length) counts.push(`📍 ${t.cities.length}`);
      if((t.budget||[]).length) counts.push(`💰 ${t.budget.length}`);
      if((t.plans||[]).length) counts.push(`📅 ${t.plans.length}`);
      if((t.packing||[]).length) counts.push(`🎒 ${t.packing.length}`);
      const rating=t.review&&t.review.rating;
      return `<div class="trip-card" onclick="openTrip('${t.id}')">
        <span class="dday ${dd.cls}">${dd.label}</span>
        <div class="tname">${esc(t.name)||'(이름 없음)'}${rating?` <span class="card-stars">${reviewStarsMini(rating)}</span>`:''}</div>
        <div class="tmeta">${fmtPeriod(t)}${counts.length?' · '+counts.join('  '):''}</div>
        <div class="tflags">${flags}</div>
      </div>`;
    }).join('');
  }
  scr.innerHTML = html;
}
function setTripListScope(s){ tripListScope=s; renderTrips(); }

/* ═══════════ 새 여행 / 수정 폼 ═══════════ */
function openTripForm(id, seed){
  ensureTripDom();
  editTripId = id || null;
  tripFormSeed = id ? null : (seed || null);
  const t = id ? getTrip(id) : tripFormSeed;
  document.getElementById('tripFormTitle').textContent = id ? '여행 수정' : (tripFormSeed ? '위시에서 여행 만들기' : '새 여행 만들기');
  document.getElementById('tf-name').value = t ? (t.name||'') : '';
  document.getElementById('tf-start').value = t ? (t.startDate||'') : '';
  document.getElementById('tf-end').value = t ? (t.endDate||'') : '';
  formSel = t ? [...(t.countries||[])] : [];
  document.getElementById('tf-country').value = '';
  document.getElementById('tf-picklist').classList.remove('show');
  renderSelChips();
  onTripStartChange();   // 시작일이 미리 채워져 있으면(위시 승격 등) 종료일 기본값 세팅
  document.getElementById('sheetbg').classList.add('show');
  document.getElementById('tripFormSheet').classList.add('show');
}
function closeTripForm(){
  document.getElementById('sheetbg').classList.remove('show');
  document.getElementById('tripFormSheet').classList.remove('show');
  tripFormSeed=null;
}
/* 시작일을 정하면 종료일 기본값 = 다음날, 종료일 달력 최소값도 시작일로 (고르기 쉽게) */
function onTripStartChange(){
  const s=document.getElementById('tf-start').value;
  const endEl=document.getElementById('tf-end');
  if(!s){ endEl.removeAttribute('min'); return; }
  endEl.min=s;
  if(!endEl.value || endEl.value<s){
    const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+1);
    endEl.value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
}
function filterCountries(q){
  const box=document.getElementById('tf-picklist');
  q=(q||'').trim().toLowerCase();
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const hits=[];
  for(const eng in COUNTRY){
    if(formSel.includes(eng)) continue;
    const ko=COUNTRY[eng][0];
    if(ko.toLowerCase().includes(q)||eng.toLowerCase().includes(q)) hits.push({eng,ko});
  }
  hits.sort((a,b)=>{
    const ap=a.ko.toLowerCase().startsWith(q)?0:1, bp=b.ko.toLowerCase().startsWith(q)?0:1;
    return ap-bp || a.ko.localeCompare(b.ko);
  });
  if(!hits.length){ box.innerHTML='<div class="none">검색 결과가 없어요 🥲</div>'; box.classList.add('show'); return; }
  box.innerHTML=hits.slice(0,20).map(h=>
    `<div class="pi" onclick="addCountry('${h.eng.replace(/'/g,"\\'")}')">${esc(h.ko)} <small>${esc(h.eng)}</small></div>`
  ).join('');
  box.classList.add('show');
}
function addCountry(eng){
  if(!formSel.includes(eng)) formSel.push(eng);
  document.getElementById('tf-country').value='';
  document.getElementById('tf-picklist').classList.remove('show');
  renderSelChips();
}
function removeCountry(eng){ formSel=formSel.filter(c=>c!==eng); renderSelChips(); }
function renderSelChips(){
  const el=document.getElementById('tf-selchips');
  el.innerHTML = formSel.map(eng=>
    `<span class="selchip">${esc(koName(eng))}<button onclick="removeCountry('${eng.replace(/'/g,"\\'")}')">×</button></span>`
  ).join('');
}
function saveTripForm(){
  const name=document.getElementById('tf-name').value.trim();
  const start=document.getElementById('tf-start').value;
  const end=document.getElementById('tf-end').value;
  if(!name){ toast('여행 이름을 입력해주세요'); return; }
  if(start && end && end<start){ toast('종료일이 시작일보다 빨라요'); return; }
  const promotedWishId=!editTripId&&tripFormSeed?.wishId;
  if(promotedWishId&&start&&!end){ toast('위시에서 여행을 만들 때는 종료일도 입력해주세요'); return; }
  if(editTripId){
    const t=getTrip(editTripId);
    if(t){ t.name=name; t.startDate=start; t.endDate=end||start; t.countries=[...formSel]; stamp(t); }
  } else {
    const t=newTrip();
    t.name=name; t.startDate=start; t.endDate=end||start; t.countries=[...formSel]; stamp(t);
    state.trips.push(t);
    curTripId=t.id;
    if(promotedWishId){
      markDeleted(promotedWishId);
      state.wishes=state.wishes.filter(w=>w.id!==promotedWishId);
    }
  }
  const wasEdit = !!editTripId;
  persist();
  closeTripForm();
  renderTrips();
  // 상세가 열려 있으면(수정 케이스) 헤더도 갱신
  if(document.getElementById('tripDetail')?.classList.contains('show') && curTripId) renderTripDetail();
  toast(wasEdit?'수정했어요':'여행을 만들었어요 ✈️');
}

/* ═══════════ 여행 상세 ═══════════ */
const SUBTABS = [
  { key:'cities',  label:'📍 도시' },
  { key:'plans',   label:'📅 일정' },

function switchSubtab(k){ curSubtab=k; renderTripDetail(); }
function setTripWhoFilter(w){ tripWhoFilter=w; renderTripDetail(); }
/* 각 서브탭 내용 — 각 모듈이 전역 render 함수를 정의하면 그걸 호출.
   아직 없으면 안내 placeholder. */
function renderSubtab(){

    cities:  { fn:'renderCities',  step:'3단계' },

    review:  { fn:'renderReview',  step:'후기 UI' }
  };

  body.innerHTML=`<div class="empty-state"><span class="big">${label.split(' ')[0]}</span>
    ${label.split(' ')[1]} 기능은 ${m.step}에서 만들어요.</div>`;
}
function editCurrentTrip(){ if(curTripId) openTripForm(curTripId); }
function deleteCurrentTrip(){
  const t=getTrip(curTripId); if(!t) return;
  if(!confirm(`"${t.name||'이 여행'}"을(를) 삭제할까요?\n일정·가계부·준비물도 함께 지워져요.`)) return;
  // 여행과 하위 항목 id 전부 삭제 기록 (서버 병합에서 제외)
  markDeleted(t.id);
  ['cities','plans','budget','packing'].forEach(k=>(t[k]||[]).forEach(x=>markDeleted(x.id)));
  state.trips=state.trips.filter(x=>x.id!==t.id);
  persist();
  closeTrip();
  toast('여행을 삭제했어요');
}
/* ═══════════ 폼/상세 DOM 주입 (한 번만) ═══════════ */
function ensureTripDom(){

  wrap.innerHTML=`

            oninput="filterCountries(this.value)" onfocus="filterCountries(this.value)">

</script>
<script>
/* ═══════════════════════════════════════════════
   map.js — 🗺️ 지도 (Leaflet) + 📍 도시 서브탭
   여행들의 cities → 방문 나라/도시 파생 → 지도 자동 색칠
   (v1 지도 로직 이식: polylabel · fixAntimeridian · noWrap 등)
   ═══════════════════════════════════════════════ */
const WORLD_TOPO="https://cdn.jsdelivr.net/npm/world-atlas@2/countries-10m.json";
const KOREA_GEO="https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea_municipalities_geo_simple.json";
const METRO={"11":"서울","21":"부산","22":"대구","23":"인천","24":"광주","25":"대전","26":"울산","29":"세종"};
const MAJOR=new Set(["러시아","캐나다","미국","중국","브라질","호주","인도","아르헨티나","카자흐스탄","알제리","사우디아라비아","멕시코","인도네시아","이란","몽골","페루","앙골라","남아프리카공화국","콜롬비아","에티오피아","볼리비아","이집트","나이지리아","베네수엘라","파키스탄","터키","칠레","프랑스","스페인","우크라이나","스웨덴","독일","일본","핀란드","폴란드","이탈리아","영국","노르웨이","태국","미얀마","그린란드","대한민국"]);

let map, worldLayer, koreaLayer, markerGroup, labelGroup, unitLabelGroup;
let worldGeoData=null, koreaGeoData=null, WORLD_CENTER={}, KR_CENTER={};
let mapScope='world', selName=null, mapInited=false;
let V={countries:{},cities:{}}, KU={};   // 파생 캐시

const isKorea = c => c==='South Korea'||c==='대한민국'||c==='Korea';
function whoNames(set){const n=new Set();if(set.has('both')){n.add(CONFIG.NAME_ME);n.add(CONFIG.NAME_PARTNER);}if(set.has('me'))n.add(CONFIG.NAME_ME);if(set.has('partner'))n.add(CONFIG.NAME_PARTNER);return[...n].join('·');}
function isWish(scope,name){return state.wishes.some(w=>w.scope===scope&&w.name===name);}
function getWish(scope,name){return state.wishes.find(w=>w.scope===scope&&w.name===name);}

/* 한국 시·군 매칭: 도시명 → KR_CENTER 키 */
function matchKrUnit(city){
  if(!city) return null;
  if(KR_CENTER[city]) return city;
  const keys=Object.keys(KR_CENTER);
  let k=keys.find(u=>u===city||u.startsWith(city)||city.startsWith(u));
  return k||null;
}
function deriveKoreaUnits(){
  const u={};
  state.trips.forEach(t=>{
    const seen=new Set();   // 여행당 한 지역 1회
    (t.cities||[]).forEach(c=>{
      if(!isKorea(c.country)) return;
      const unit=matchKrUnit(c.city); if(!unit) return;
      (u[unit]=u[unit]||{who:new Set(),count:0});
      if(c.who)u[unit].who.add(c.who);
      if(!seen.has(unit)){ u[unit].count++; seen.add(unit); }
    });
  });
  return u;
}

/* ── 색상 ── */
function whoStyle(set){
  const both=set.has('both'),me=set.has('me'),pt=set.has('partner');
  if(both) return {fillColor:'#5FAE7E',fillOpacity:.72,color:'#fff',weight:.7};
  if(me&&pt) return {fillColor:'#8A7B9E',fillOpacity:.68,color:'#fff',weight:.7};
  if(me) return {fillColor:'#B06B6B',fillOpacity:.70,color:'#fff',weight:.7};
  if(pt) return {fillColor:'#6B84B0',fillOpacity:.70,color:'#fff',weight:.7};
  return null;
}
function styleFor(scope,name){
  const rec=scope==='world'?V.countries[name]:KU[name];
  const wish=isWish(scope,name);
  let s;
  if(rec) s=Object.assign({},whoStyle(rec.who));
  else if(wish) s={fillColor:'#EBD98A',fillOpacity:.6,color:'#CBB85C',weight:1.3,dashArray:'4'};
  else s={fillColor:'#DCD2C8',fillOpacity:scope==='world'?.35:.5,color:'#fff',weight:.6};
  if(name===selName){
    s.weight=3.5; s.color='#5C4948';
    if(!rec&&!wish){ s.fillColor='#FFD97A'; s.fillOpacity=.55; }
    else s.fillOpacity=Math.min((s.fillOpacity||.5)+.2,.95);
  }
  return s;
}

/* ═══════════ 지오 데이터 로드 (v1 이식) ═══════════ */
function fixAntimeridian(f){
  const g=f.geometry; if(!g) return;
  const polys=g.type==='Polygon'?[g.coordinates]:(g.type==='MultiPolygon'?g.coordinates:[]);
  polys.forEach(rings=>rings.forEach(ring=>{
    let min=180,max=-180;
    for(const pt of ring){if(pt[0]<min)min=pt[0];if(pt[0]>max)max=pt[0];}
    if(max-min>180) for(const pt of ring){if(pt[0]<0)pt[0]+=360;}
  }));
}
function polygonArea(ring){let a=0;for(let i=0,n=ring.length,j=n-1;i<n;j=i++){a+=(ring[j][0]+ring[i][0])*(ring[j][1]-ring[i][1]);}return Math.abs(a/2);}
function countryLabelPos(f){
  const g=f.geometry; if(!g) return null;
  const polys=g.type==='Polygon'?[g.coordinates]:(g.type==='MultiPolygon'?g.coordinates:[]);
  let biggest=null,ba=-1;
  polys.forEach(p=>{const a=polygonArea(p[0]);if(a>ba){ba=a;biggest=p;}});
  if(!biggest) return null;
  try{ if(typeof polylabel==='function'){const pt=polylabel(biggest,0.5);if(pt&&isFinite(pt[0])&&isFinite(pt[1]))return L.latLng(pt[1],pt[0]);} }catch(e){}
  return L.geoJSON(f).getBounds().getCenter();
}
async function loadWorld(){
  if(worldGeoData) return;
  toast('세계 지도를 불러오는 중… 🌍');
  const topo=await (await fetch(WORLD_TOPO)).json();
  worldGeoData=topojson.feature(topo,topo.objects.countries);
  worldGeoData.features=worldGeoData.features.filter(f=>f.properties.name!=='Antarctica');
  worldGeoData.features.forEach(f=>{
    f.properties.name=ALIAS[f.properties.name]||f.properties.name;
    fixAntimeridian(f);
    try{const pos=countryLabelPos(f);if(pos&&pos.lat>=-60&&pos.lat<=85&&pos.lng>=-180&&pos.lng<=180)WORLD_CENTER[f.properties.name]=pos;}catch(e){}
  });
}
async function loadKorea(){
  if(koreaGeoData) return;
  toast('한국 지도를 불러오는 중… 🚚');
  koreaGeoData=await (await fetch(KOREA_GEO)).json();
  koreaGeoData.features.forEach(f=>{
    const code=String(f.properties.code||''),pref=code.slice(0,2);
    let unit=METRO[pref]||f.properties.name;
    if(!METRO[pref]){const m=String(unit).match(/^(.+?시)./);if(m&&unit.endsWith('구'))unit=m[1];}
    f.properties.unit=unit;
  });
  const groups={};
  koreaGeoData.features.forEach(f=>(groups[f.properties.unit]=groups[f.properties.unit]||[]).push(f));
  Object.keys(groups).forEach(u=>{
    let best=null,bestArea=-1;
    groups[u].forEach(f=>{
      const geom=f.geometry,polys=geom.type==='Polygon'?[geom.coordinates]:(geom.type==='MultiPolygon'?geom.coordinates:[]);
      polys.forEach(pp=>{const ring=pp[0];let area=0,cx=0,cy=0;
        for(let i=0;i<ring.length-1;i++){const[x1,y1]=ring[i],[x2,y2]=ring[i+1];const cr=x1*y2-x2*y1;area+=cr;cx+=(x1+x2)*cr;cy+=(y1+y2)*cr;}
        area/=2;const abs=Math.abs(area);if(abs>bestArea&&abs>0){bestArea=abs;best=L.latLng(cy/(6*area),cx/(6*area));}});
    });
    KR_CENTER[u]=best||L.geoJSON({type:'FeatureCollection',features:groups[u]}).getBounds().getCenter();
  });
}

/* ═══════════ 지도 그리기 ═══════════ */
function initMap(){
  map=L.map('map',{zoomControl:true,attributionControl:true,preferCanvas:true,maxBounds:[[-90,-200],[90,200]],maxBoundsViscosity:0.5});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',maxZoom:12,noWrap:true}).addTo(map);
  markerGroup=L.layerGroup().addTo(map);
  labelGroup=L.layerGroup().addTo(map);
  unitLabelGroup=L.layerGroup().addTo(map);
  map.on('zoomend',()=>{ if(mapScope==='korea')renderKoreaLabels(); else renderWorldLabels(); });
  map.setView([25,60],2);
  mapInited=true;
}
function renderMap(){
  ensureMapDom();
  if(!mapInited) initMap();
  setTimeout(()=>map&&map.invalidateSize(),60);   // 숨겨졌다 보일 때 크기 보정
  drawMap();
}
async function drawMap(){
  V=deriveVisited(); KU=deriveKoreaUnits();
  renderStats();
  if(mapScope==='world'){ await loadWorld(); drawWorld(); }
  else { await loadKorea(); drawKorea(); }
}
function clearLayers(){
  markerGroup.clearLayers();labelGroup.clearLayers();unitLabelGroup.clearLayers();
  if(worldLayer){map.removeLayer(worldLayer);worldLayer=null;}
  if(koreaLayer){map.removeLayer(koreaLayer);koreaLayer=null;}
}
function drawWorld(){
  clearLayers();
  map.setMinZoom(1); map.setMaxZoom(10);
  worldLayer=L.geoJSON(worldGeoData,{
    style:f=>styleFor('world',f.properties.name),
    onEachFeature:(f,layer)=>layer.on('click',()=>{highlight('world',f.properties.name);openCountryDetail('world',f.properties.name);})
  }).addTo(map);
  renderWorldLabels(); renderCityMarkers();
}
function drawKorea(){
  clearLayers();
  map.setMinZoom(6); map.setMaxZoom(12);
  koreaLayer=L.geoJSON(koreaGeoData,{
    style:f=>styleFor('korea',f.properties.unit),
    onEachFeature:(f,layer)=>layer.on('click',()=>{highlight('korea',f.properties.unit);openCountryDetail('korea',f.properties.unit);})
  }).addTo(map);
  renderKoreaLabels();
}
function setMapScope(s){
  mapScope=s; selName=null;
  document.getElementById('mt-world').classList.toggle('on',s==='world');
  document.getElementById('mt-korea').classList.toggle('on',s==='korea');
  resetMapSearch();
  // 줌 범위를 먼저 맞춘 뒤(안 그러면 minZoom에 걸려) 즉시 이동 → 한 번에 이동됨
  if(s==='world'){ map.setMinZoom(1); map.setMaxZoom(10); map.setView([25,60],2); }
  else { map.setMinZoom(6); map.setMaxZoom(12); map.setView([36.3,127.8],7); }
  drawMap();
}
function highlight(scope,name){
  selName=name;
  const lay=scope==='world'?worldLayer:koreaLayer;
  if(lay) lay.eachLayer(l=>{
    const n=scope==='world'?l.feature.properties.name:l.feature.properties.unit;
    l.setStyle(styleFor(scope,n));
    if(n===name&&l.bringToFront) l.bringToFront();
  });
  if(scope==='world') renderCityMarkers();
}
function renderCityMarkers(){
  markerGroup.clearLayers();
  if(mapScope!=='world'||!selName) return;
  Object.values(V.cities).filter(c=>c.country===selName&&c.lat).forEach(c=>{
    const both=c.who.has('both'),me=c.who.has('me'),pt=c.who.has('partner');
    const color=both?'#4C9068':(me&&pt)?'#6E5F82':me?'#8F5555':'#556E96';
    L.marker([c.lat,c.lng],{icon:L.divIcon({className:'city-marker',html:`<div class="city-dot" style="background:${color}"></div><div class="city-name">${esc(c.city)}</div>`,iconSize:null,iconAnchor:[5,5]})})
      .on('click',()=>openCountryDetail('world',selName)).addTo(markerGroup);
  });
}
function renderWorldLabels(){
  labelGroup.clearLayers();
  if(mapScope!=='world'||!worldGeoData) return;
  const z=map.getZoom();
  worldGeoData.features.forEach(f=>{
    const name=f.properties.name, center=WORLD_CENTER[name]; if(!center) return;
    const rec=V.countries[name], wish=isWish('world',name), crowned=rec&&rec.count>=2;
    const showAll=z>=5;
    if(!rec&&!wish&&!crowned&&!(showAll&&MAJOR.has(koName(name)))) return;
    let txt=(crowned?'<span class="cr">👑</span> ':'')+koName(name);
    if(rec&&!rec.who.has('both')) txt+=`<br><span style="color:#8A6B6B">${whoNames(rec.who)}</span>`;
    L.marker(center,{icon:L.divIcon({className:'name-label'+(crowned?' crown':''),html:txt,iconSize:null}),interactive:false}).addTo(labelGroup);
  });
}
function renderKoreaLabels(){
  unitLabelGroup.clearLayers();
  if(mapScope!=='korea'||!koreaGeoData) return;
  const showAll=map.getZoom()>=9;
  Object.keys(KR_CENTER).forEach(unit=>{
    const rec=KU[unit], wish=isWish('korea',unit);
    if(!showAll&&!rec&&!wish) return;
    const crowned=rec&&rec.count>=2;
    let txt=(crowned?'<span class="cr">👑</span> ':'')+unit;
    if(rec&&!rec.who.has('both')) txt+=`<br><span style="color:#8A6B6B">${whoNames(rec.who)}</span>`;
    L.marker(KR_CENTER[unit],{icon:L.divIcon({className:'name-label clickable'+(crowned?' crown':''),html:txt,iconSize:null}),interactive:true})
      .on('click',()=>{highlight('korea',unit);openCountryDetail('korea',unit);}).addTo(unitLabelGroup);
  });
}

/* ═══════════ 지도 검색 (나라 / 국내 시·군) ═══════════ */
function toggleMapSearch(){
  const bar=document.getElementById('mapSearchbar');
  const button=document.getElementById('mapSearchBtn');
  const open=bar.classList.toggle('show');
  button.classList.toggle('on',open);
  if(open){
    const input=document.getElementById('mapSearchInput');
    input.placeholder=mapScope==='world'?'🔍 나라 검색 (예: 터키, 일본)':'🔍 지역 검색 (예: 서울, 속초시)';
    setTimeout(()=>input.focus(),50);
  }else resetMapSearch();
}
function resetMapSearch(){
  const bar=document.getElementById('mapSearchbar');
  const button=document.getElementById('mapSearchBtn');
  const input=document.getElementById('mapSearchInput');
  const list=document.getElementById('mapSearchList');
  if(!bar||!button||!input||!list) return;
  bar.classList.remove('show'); button.classList.remove('on'); input.value='';
  list.classList.remove('show'); list.innerHTML='';
}
function mapSearchTag(scope,name){
  const rec=scope==='world'?V.countries[name]:KU[name];
  if(rec){
    const label=rec.who.has('both')?'같이':whoNames(rec.who)+' 다녀옴';
    const color=rec.who.has('both')?'var(--both)':'var(--me)';
    return `<span class="tag" style="background:${color}">${esc(label)}</span>`;
  }
  return isWish(scope,name)?'<span class="tag" style="background:var(--wish-line)">위시</span>':'';
}
function onMapSearch(query){
  const box=document.getElementById('mapSearchList');
  const q=(query||'').trim().toLowerCase();
  if(!q){box.classList.remove('show');box.innerHTML='';return;}
  if(mapScope==='world'){
    const hits=Object.keys(COUNTRY).filter(eng=>{
      const ko=COUNTRY[eng][0]; return ko.toLowerCase().includes(q)||eng.toLowerCase().includes(q);
    }).sort((a,b)=>{
      const ap=COUNTRY[a][0].toLowerCase().startsWith(q)?0:1;
      const bp=COUNTRY[b][0].toLowerCase().startsWith(q)?0:1;
      return ap-bp||COUNTRY[a][0].localeCompare(COUNTRY[b][0]);
    });
    box.innerHTML=hits.length?hits.slice(0,20).map(eng=>`<button class="si" onclick="pickMapSearch('world','${eng.replace(/'/g,"\\'")}')">🌍 ${esc(koName(eng))}${mapSearchTag('world',eng)}</button>`).join(''):'<div class="none">검색 결과가 없어요 🥲</div>';
  }else{
    const units=Object.keys(KR_CENTER);
    if(!units.length){box.innerHTML='<div class="none">한국 지도를 불러오는 중이에요. 잠시 후 다시 검색해주세요.</div>';box.classList.add('show');return;}
    const hits=units.filter(unit=>unit.toLowerCase().includes(q)).sort((a,b)=>{
      const ap=a.toLowerCase().startsWith(q)?0:1,bp=b.toLowerCase().startsWith(q)?0:1;
      return ap-bp||a.localeCompare(b);
    });
    box.innerHTML=hits.length?hits.slice(0,20).map(unit=>`<button class="si" onclick="pickMapSearch('korea','${unit.replace(/'/g,"\\'")}')">🇰🇷 ${esc(unit)}${mapSearchTag('korea',unit)}</button>`).join(''):'<div class="none">검색 결과가 없어요 🥲</div>';
  }
  box.classList.add('show');
}
function pickMapSearch(scope,name){
  const center=scope==='world'?WORLD_CENTER[name]:KR_CENTER[name];
  resetMapSearch();
  if(center) map.setView(center,Math.max(map.getZoom(),scope==='world'?4:9));
  highlight(scope,name); openCountryDetail(scope,name);
}

/* ═══════════ 통계 칩 ═══════════ */
/* 방문 집계에서 특정 who로 필터한 나라/지역 이름 목록 */
function statNames(filter){
  const src=mapScope==='world'?V.countries:KU;
  return Object.keys(src).filter(name=>{
    const w=src[name].who;
    if(filter==='me') return w.has('me')||w.has('both');
    if(filter==='partner') return w.has('partner')||w.has('both');
    if(filter==='both') return w.has('both');
    return true;
  }).sort((a,b)=>koName(a).localeCompare(koName(b)));
}
function renderStats(){
  const el=document.getElementById('stats'); if(!el) return;
  const src=mapScope==='world'?V.countries:KU;
  const me=statNames('me').length, pt=statNames('partner').length, both=statNames('both').length;
  const total=Object.keys(src).length;
  const wishN=state.wishes.filter(w=>w.scope===mapScope).length;
  const unitLabel=mapScope==='world'?'🌍 나라':'🇰🇷 지역';
  let html=`<div class="stat" onclick="openStatList('me')">🧑 ${CONFIG.NAME_ME} <b>${me}</b></div>
    <div class="stat" onclick="openStatList('partner')">👩 ${CONFIG.NAME_PARTNER} <b>${pt}</b></div>
    <div class="stat" onclick="openStatList('both')">💕 같이 <b>${both}</b></div>
    <div class="stat" onclick="openStatList('all')">${unitLabel} <b>${total}</b></div>`;
  if(mapScope==='world') html+=`<div class="stat" onclick="openStatList('cities')">📍 도시 <b>${Object.keys(V.cities).length}</b></div>`;
  html+=`<div class="stat" onclick="openStatList('wish')">⭐ 위시 <b>${wishN}</b></div>
    <div class="stat rank" onclick="openRanking()">🏆 랭킹</div>`;
  el.innerHTML=html;
}
/* 통계칩 클릭 → 목록 시트 */
function whoBadge(whoSet){
  if(whoSet.has('both')) return '<span class="badge both">같이</span>';
  const me=whoSet.has('me'), pt=whoSet.has('partner');
  if(me&&pt) return `<span class="badge me">${CONFIG.NAME_ME}</span> <span class="badge pt">${CONFIG.NAME_PARTNER}</span>`;
  if(me) return `<span class="badge me">${CONFIG.NAME_ME}</span>`;
  return `<span class="badge pt">${CONFIG.NAME_PARTNER}</span>`;
}
function openStatList(kind){
  const src=mapScope==='world'?V.countries:KU;
  const scope=mapScope;
  let title, rows='';
  if(kind==='wish'){
    title='⭐ 위시리스트';
    const ws=state.wishes.filter(w=>w.scope===scope);
    rows=ws.map(w=>{
      const nm=scope==='world'?koName(w.name):w.name;
      const wb=w.who==='both'?'같이':w.who==='me'?CONFIG.NAME_ME:CONFIG.NAME_PARTNER;
      return `<div class="rec" style="cursor:pointer" onclick="closeMapSheet();highlight('${scope}','${String(w.name).replace(/'/g,"\\'")}');openCountryDetail('${scope}','${String(w.name).replace(/'/g,"\\'")}')">
        <div class="r1"><span class="city">${esc(nm)}</span><span class="who" style="background:var(--wish-line)">${wb}</span></div></div>`;
    }).join('');
  } else if(kind==='cities'){
    title='📍 다녀온 도시';
    rows=Object.values(V.cities).sort((a,b)=>a.country.localeCompare(b.country)).map(c=>
      `<div class="rec" style="cursor:pointer" onclick="closeMapSheet();highlight('world','${String(c.country).replace(/'/g,"\\'")}');openCountryDetail('world','${String(c.country).replace(/'/g,"\\'")}')">
        <div class="r1"><span class="city">${esc(c.city)}</span>${whoBadge(c.who)}</div>
        <div class="meta">${esc(koName(c.country))}</div></div>`).join('');
  } else {
    const T={all:scope==='world'?'🌍 방문한 나라':'🇰🇷 다녀온 지역',me:`🧑 ${CONFIG.NAME_ME}가 간 곳`,partner:`👩 ${CONFIG.NAME_PARTNER}가 간 곳`,both:'💕 같이 간 곳'};
    title=T[kind];
    const names=statNames(kind);
    rows=names.map(name=>{
      const nm=scope==='world'?koName(name):name;
      return `<div class="rec" style="cursor:pointer" onclick="closeMapSheet();highlight('${scope}','${String(name).replace(/'/g,"\\'")}');openCountryDetail('${scope}','${String(name).replace(/'/g,"\\'")}')">
        <div class="r1"><span class="city">${esc(nm)}</span>${whoBadge(src[name].who)}</div></div>`;
    }).join('');
  }
  const count=rows?rows.match(/class="rec"/g).length:0;
  showMapSheet(`<h2>${title} <span style="color:var(--sub);font-size:15px">${count}</span></h2>${rows||'<p class="hint" style="margin-top:10px">아직 없어요.</p>'}`);
}
function openRanking(){
  const src=mapScope==='world'?V.countries:KU;
  const rows=Object.entries(src).map(([n,o])=>[n,o.count]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const medal=i=>['🥇','🥈','🥉','4️⃣','5️⃣'][i]||(i+1);
  let html=`<h2>🏆 ${mapScope==='world'?'세계':'국내'} 여행 랭킹</h2>`;
  if(!rows.length) html+=`<p class="hint" style="margin-top:10px">아직 기록이 없어요. 여행에 도시를 추가하면 랭킹이 생겨요!</p>`;
  else{
    html+=`<div class="rank-sec"><div class="rank-h">${mapScope==='world'?'✈️ 많이 간 나라':'📍 많이 간 지역'}</div>`;
    rows.forEach(([n,c],i)=>{const disp=mapScope==='world'?koName(n):n;
      html+=`<div class="rank-row" onclick="closeMapSheet();highlight('${mapScope}','${String(n).replace(/'/g,"\\'")}');openCountryDetail('${mapScope}','${String(n).replace(/'/g,"\\'")}')"><span class="rk">${medal(i)}</span><span class="rn">${esc(disp)}</span><span class="rc">${c}회</span></div>`;});
    html+=`</div>`;
  }
  showMapSheet(html);
}

/* ═══════════ 나라/지역 상세 시트 ═══════════ */
let curDetail=null;
function openCountryDetail(scope,name){
  curDetail={scope,name};
  const rec=scope==='world'?V.countries[name]:KU[name];
  const wishObj=getWish(scope,name);
  const kn=scope==='world'?koName(name):name;
  const crown=rec&&rec.count>=2?' 👑':'';
  const badge=rec?(rec.who.has('both')?'<span class="badge both">같이 다녀옴 💕</span>':`<span class="badge me">${whoNames(rec.who)} 다녀옴</span>`)
    :wishObj?'<span class="badge wish">⭐ 위시</span>':'<span class="badge none">아직 안 가봄</span>';
  let html=`<h2>${esc(kn)}${crown} ${badge}</h2>`;
  // 이 나라/지역을 방문한 여행 + 도시
  const trips=state.trips.filter(t=>(t.cities||[]).some(c=>scope==='world'?c.country===name:(isKorea(c.country)&&matchKrUnit(c.city)===name)));
  if(trips.length){
    html+=`<div class="summary-line">✈️ 관련 여행 <b>${trips.length}</b>개</div>`;
    trips.forEach(t=>{
      const cs=(t.cities||[]).filter(c=>scope==='world'?c.country===name:matchKrUnit(c.city)===name);
      html+=`<div class="rec" onclick="closeMapSheet();openTrip('${t.id}')" style="cursor:pointer">
        <div class="r1"><span class="city">${esc(t.name)||'(이름 없음)'}</span><span class="who" style="background:var(--both)">${tripDday(t).label}</span></div>
        <div class="meta">📍 ${cs.map(c=>esc(c.city)).join(', ')}</div></div>`;
    });
  } else {
    html+=`<p class="hint" style="margin-top:8px">아직 이 곳을 다녀온 여행이 없어요.</p>`;
  }
  html+=`<div class="btnrow"><button class="btn gold" onclick="toggleWish()">${wishObj?'⭐ 위시 해제':'⭐ 가고 싶어요'}</button></div>`;
  if(!wishObj) html+=`<div class="wishwho" id="wishwho" style="display:none"></div>`;
  showMapSheet(html);
}
function toggleWish(){
  const {scope,name}=curDetail;
  const i=state.wishes.findIndex(w=>w.scope===scope&&w.name===name);
  if(i>=0){ markDeleted(state.wishes[i].id); state.wishes.splice(i,1); persist(); toast('위시에서 뺐어요'); drawMap(); openCountryDetail(scope,name); }
  else{
    const kn=scope==='world'?koName(name):name;
    showMapSheet(`<h2>⭐ ${esc(kn)} 위시 담기</h2><p class="hint" style="margin:8px 0 4px">누가 가고 싶어 하나요?</p>
      <div class="wishwho"><button onclick="addWish('me')" style="background:var(--me)">🧑 ${CONFIG.NAME_ME}</button>
      <button onclick="addWish('partner')" style="background:var(--pt)">👩 ${CONFIG.NAME_PARTNER}</button>
      <button onclick="addWish('both')" style="background:var(--both)">💕 같이</button></div>
      <div class="btnrow"><button class="btn ghost" onclick="openCountryDetail('${scope}','${String(name).replace(/'/g,"\\'")}')">← 취소</button></div>`);
  }
}
function addWish(who){
  const {scope,name}=curDetail;
  state.wishes.push(stamp({id:uid('w'),scope,name,who,planDate:null}));
  persist(); toast('위시에 담았어요 ⭐'); drawMap(); openCountryDetail(scope,name);
}

/* 시트 표시/닫기 */

/* ═══════════ 📍 도시 서브탭 (여행 상세 안) ═══════════ */
let cityForm={tripId:null,editId:null,who:null,geo:null};

function openCityForm(tripId,cityId){

function closeCityForm(){document.getElementById('mapSheetBg').classList.remove('show');document.getElementById('citySheet').classList.remove('show');}
function setCityWho(w){cityForm.who=w;document.querySelectorAll('#cf-who .chip').forEach(x=>x.classList.toggle('on',x.dataset.who===w));}
async function geocodeCity(){
  const q=document.getElementById('cf-city').value.trim();
  const country=document.getElementById('cf-country').value;
  if(!q){toast('도시 이름을 입력해주세요');return;}
  const box=document.getElementById('cf-geo'); box.style.display='block'; box.innerHTML='<span class="spin">↻</span> 위치를 찾는 중…';
  cityForm.geo=null;
  try{
    let res=await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q=${encodeURIComponent(q+', '+country)}`)).json();
    if(!res.length) res=await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q=${encodeURIComponent(q)}`)).json();
    if(!res.length){box.innerHTML='못 찾았어요 🥲 영문으로도 시도해보세요';return;}
    cityForm.geo={lat:+res[0].lat,lng:+res[0].lon};
    box.innerHTML=`✅ 찾았어요: <b>${esc(res[0].display_name.split(',').slice(0,2).join(','))}</b>`;
  }catch(e){box.innerHTML='검색 오류 — 잠시 후 다시';}
}
function saveCity(){
  const t=getTrip(cityForm.tripId); if(!t) return;
  const city=document.getElementById('cf-city').value.trim();
  const country=document.getElementById('cf-country').value;
  if(!city){toast('도시 이름을 입력해주세요');return;}
  if(!cityForm.who){toast('누가 다녀왔는지 골라주세요');return;}
  if(!cityForm.geo){toast('[찾기]를 눌러 위치를 확인해주세요 📍');return;}
  const memo=document.getElementById('cf-memo').value.trim();

<script>
/* ═══════════════════════════════════════════════
   budget.js — 💰 가계부 (여행 상세 안 서브탭)
   모든 지출은 50:50 공동부담, 결제자만 기록 →
   N빵 정산: "가진 → 윤호 X원" 한 줄로 자동 계산. (원화만)
   ═══════════════════════════════════════════════ */
const BUD_CATS=[['숙소','🏨'],['식사','🍜'],['교통','🚕'],['쇼핑','🛍️'],['관광','🎡'],['기타','🧾']];
const catIcon=c=>{const f=BUD_CATS.find(x=>x[0]===c);return f?f[1]:'🧾';};
const won=n=>(n||0).toLocaleString('ko-KR')+'원';

/* 정산 계산: 각 지출을 반씩 부담. me/partner 결제분만 채무 발생, 공동(both)은 중립 */
function calcSettle(trip){
  let total=0, mePaid=0, ptPaid=0;
  (trip.budget||[]).forEach(b=>{
    const a=+b.amount||0; total+=a;
    if(b.payer==='me') mePaid+=a;
    else if(b.payer==='partner') ptPaid+=a;
  });
  // 가진이 윤호에게 보내야 할 금액(+) / 음수면 반대
  const net=Math.round((mePaid-ptPaid)/2);
  return {total, mePaid, ptPaid, bothPaid:total-mePaid-ptPaid, net};
}

function renderBudget(trip, body){
  const s=calcSettle(trip);
  let settleHtml;
  if(!(trip.budget||[]).length) settleHtml='';
  else if(s.net===0) settleHtml=`<div class="settle-result done">✅ 정산 완료 — 딱 맞아요!</div>`;
  else if(s.net>0) settleHtml=`<div class="settle-result">💸 <b>${CONFIG.NAME_PARTNER}</b> → <b>${CONFIG.NAME_ME}</b><br><span class="amt">${won(s.net)}</span> 보내면 딱 맞음</div>`;
  else settleHtml=`<div class="settle-result">💸 <b>${CONFIG.NAME_ME}</b> → <b>${CONFIG.NAME_PARTNER}</b><br><span class="amt">${won(-s.net)}</span> 보내면 딱 맞음</div>`;

  let html=`<div class="settle-card">
    <div class="total">총 지출<br><b>${won(s.total)}</b></div>
    <div class="paidrow">
      <div class="paid">🧑 ${CONFIG.NAME_ME}<b>${won(s.mePaid)}</b></div>
      <div class="paid">👩 ${CONFIG.NAME_PARTNER}<b>${won(s.ptPaid)}</b></div>
      <div class="paid">💕 공동<b>${won(s.bothPaid)}</b></div>
    </div>${settleHtml}</div>
    <div class="fab-row"><button class="btn primary" onclick="openBudgetForm('${trip.id}')">+ 지출 추가</button></div>`;

  const items=(trip.budget||[]).filter(b=>typeof passWho!=='function'||passWho(b.payer))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.updatedAt-a.updatedAt);
  if(!items.length){
    html+=`<div class="empty-state"><span class="big">💰</span>${(trip.budget||[]).length?'이 조건에 맞는 지출이 없어요.':'지출을 추가하면<br>N빵 정산이 자동으로 계산돼요.'}</div>`;
  } else {
    let lastDate=null;
    items.forEach(b=>{
      if(b.date!==lastDate){ html+=`<div class="daygroup">${b.date?fmtDate(b.date):'날짜 미정'}</div>`; lastDate=b.date; }
      const pb=b.payer==='both'?'var(--both)':b.payer==='me'?'var(--me)':'var(--pt)';
      const pt=b.payer==='both'?'공동':b.payer==='me'?CONFIG.NAME_ME:CONFIG.NAME_PARTNER;
      html+=`<div class="exp-item" onclick="openBudgetForm('${trip.id}','${b.id}')">
        <span class="cat">${catIcon(b.cat)}</span>
        <div class="mid"><div class="et">${esc(b.title)||'(제목 없음)'}</div><div class="em">${esc(b.cat||'기타')}</div></div>
        <div class="amt">${won(+b.amount)}<span class="pay" style="background:${pb}">${pt}</span></div>
      </div>`;
    });
  }
  body.innerHTML=html;
}

/* ── 폼 ── */
let budgetForm={tripId:null,editId:null,payer:null,cat:'식사'};
function openBudgetForm(tripId,itemId){
  ensureBudgetDom();
  const t=getTrip(tripId); const b=itemId?(t.budget||[]).find(x=>x.id===itemId):null;
  budgetForm={tripId,editId:itemId||null,payer:b?b.payer:null,cat:b?b.cat||'식사':'식사'};
  document.getElementById('bf-title2').textContent=b?'지출 수정':'지출 추가';
  document.getElementById('bf-title').value=b?b.title||'':'';
  document.getElementById('bf-amount').value=b?b.amount||'':'';
  document.getElementById('bf-date').value=b?b.date||'':(t.startDate||'');
  document.querySelectorAll('#bf-payer .chip').forEach(x=>x.classList.toggle('on',x.dataset.who===(b?b.payer:'')));
  renderBudgetCats();
  document.getElementById('bf-delrow').style.display=itemId?'flex':'none';
  document.getElementById('budgetSheetBg').classList.add('show');
  document.getElementById('budgetSheet').classList.add('show');

}
function closeBudgetForm(){document.getElementById('budgetSheetBg').classList.remove('show');document.getElementById('budgetSheet').classList.remove('show');}
function setBudgetPayer(w){budgetForm.payer=w;document.querySelectorAll('#bf-payer .chip').forEach(x=>x.classList.toggle('on',x.dataset.who===w));}
function setBudgetCat(c){budgetForm.cat=c;renderBudgetCats();}
function renderBudgetCats(){
  document.getElementById('bf-cats').innerHTML=BUD_CATS.map(([c,ic])=>
    `<button class="chip${c===budgetForm.cat?' on both':''}" onclick="setBudgetCat('${c}')">${ic} ${c}</button>`).join('');
}
function saveBudget(){
  const t=getTrip(budgetForm.tripId); if(!t) return;
  const title=document.getElementById('bf-title').value.trim();
  const amount=Math.round(+document.getElementById('bf-amount').value||0);

  if(!title){toast('내용을 입력해주세요');return;}
